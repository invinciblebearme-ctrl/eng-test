<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 채점">
<link rel="manifest" id="mf" href="/teacher/w.webmanifest">
<link rel="apple-touch-icon" href="/img/app-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1B19" media="(prefers-color-scheme: dark)">
<title>영어 채점 위젯</title>
<!-- 데스크탑 위젯 화면: 사이트 /teacher/w (휴대폰 홈 화면, 예전 /w) 와 Tauri 앱(widget/desktop)이 같은 파일을 씀.
     숫자만 보여 줌 (학생 이름 없음). 연결 코드는 이 기기의 localStorage에만 저장.
     디자인: Filee 'soft' 룩 — 따뜻한 미색 바탕, 흰 카드, 보라 강조(#7F77DD), 둥근 모서리, 말랑한 눌림 -->
<style>
:root {
  --page: #F6F5F1; --surface: #FFFFFF; --surface-alt: #EFEDE6; --border: rgba(0,0,0,.086);
  --text: #1F1E1D; --muted: #6B6A66;
  --accent: #7F77DD; --accent-soft: rgba(127,119,221,.18); --accent-faint: rgba(127,119,221,.09); --accent-strong: #5F59A6;
  --danger: #C73A39; --danger-faint: rgba(199,58,57,.10); --ok: #0F7A5A; --ok-faint: rgba(15,122,90,.10); --warn: #9A5B0C;
  --shadow: 0 1px 3px rgba(0,0,0,.07), 0 6px 18px rgba(0,0,0,.05);
  --r: 16px; --r-sm: 9px; --r-lg: 22px;
  --ease: cubic-bezier(.34,1.56,.64,1);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #1B1B19; --surface: #262624; --surface-alt: #31312E; --border: rgba(255,255,255,.11);
    --text: #F1EFE8; --muted: #AEACA4;
    --accent-soft: rgba(127,119,221,.28); --accent-faint: rgba(127,119,221,.14); --accent-strong: #ABA5F0;
    --danger: #F09595; --danger-faint: rgba(240,149,149,.15); --ok: #5DCAA5; --ok-faint: rgba(93,202,165,.15); --warn: #EF9F27;
    --shadow: 0 1px 3px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.2);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); }
body {
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", "Pretendard", sans-serif;
  -webkit-font-smoothing: antialiased; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  min-height: 100vh; user-select: none; -webkit-user-select: none;
}
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 7px 14px; transition: transform .25s var(--ease), background .15s; }
button:hover { background: var(--surface-alt); }
button:active { transform: scale(.95); }
button.pri { background: var(--accent); border-color: transparent; color: #16141A; font-weight: 600; }
button.pri:hover { background: #8E87E4; }
button.icon { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* 머리 */
header { display: flex; align-items: center; gap: 10px; }
.logo { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; flex: none; }
.logo svg { width: 19px; height: 19px; }
.ttl { flex: 1; min-width: 0; }
.ttl b { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.ttl span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 카드 */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px; }
.hero { display: flex; align-items: center; gap: 14px; }
.hero .big { font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hero .big.on { color: var(--accent-strong); }
.hero .lbl { font-size: 13px; color: var(--muted); margin-top: 4px; }
.hero .side { margin-left: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-alt); font-size: 12.5px; white-space: nowrap; }
.chip b { font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.acc { background: var(--accent-faint); color: var(--accent-strong); }

/* 학년 고르기 (Filee 앞/뒤 토글 모양) */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-alt); border-radius: 999px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 6px 0; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--accent); color: #16141A; }
.seg button small { font-weight: 500; opacity: .75; margin-left: 3px; }

/* 반 목록 */
.list { padding: 6px; }
.row { display: grid; grid-template-columns: 1fr repeat(4, 46px); align-items: center; gap: 2px; padding: 9px 10px; border-radius: var(--r-sm); }
.row + .row { border-top: 1px solid var(--border); }
button.row { width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: var(--r-sm); }
button.row + button.row { border-top: 1px solid var(--border); }
button.row:hover, button.row:focus-visible { background: color-mix(in srgb, var(--text) 7%, transparent); }
.row.head { font-size: 11.5px; color: var(--muted); padding-top: 4px; padding-bottom: 4px; border: 0; }
.row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.row .n.v { color: var(--text); font-weight: 650; }
.row .n.hot { color: var(--accent-strong); }
.row .cls { font-weight: 600; }
.row .cls small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; font-size: 13px; }

.note { border-radius: var(--r); padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.note.err { background: var(--danger-faint); color: var(--danger); }
.note.ok { background: var(--ok-faint); color: var(--ok); }
.note svg { flex: none; margin-top: 1px; }
.foot { display: flex; gap: 8px; }
.foot button { flex: 1; }

/* 설정 */
.set h2 { font-size: 16px; margin: 0 0 4px; }
.set p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
input[type=text] { width: 100%; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); background: var(--page); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; user-select: text; -webkit-user-select: text; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--border); }
.opt span { flex: 1; }
.opt small { display: block; color: var(--muted); font-size: 12px; }
.sw { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--surface-alt); border: 1px solid var(--border); position: relative; cursor: pointer; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .3s var(--ease), background .2s; }
.sw:checked { background: var(--accent); }
.sw:checked::after { transform: translateX(16px); background: #fff; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9z"/><path d="m9 13 2 2 4-4"/></svg></div>
    <div class="ttl"><b>영어 채점</b><span id="sub">연결 코드를 넣어 주세요</span></div>
    <button class="icon" id="btnRefresh" title="새로 고침" aria-label="새로 고침"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    <button class="icon" id="btnSet" title="설정" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <main id="view">
    <div class="card hero">
      <div><div class="big" id="bigWait">–</div><div class="lbl">채점 대기</div></div>
      <div class="side">
        <span class="chip acc">AI 제안 <b id="cAi">–</b></span>
        <span class="chip">미공개 <b id="cUnpub">–</b></span>
        <span class="chip">오늘 제출 <b id="cToday">–</b></span>
      </div>
    </div>
    <div class="seg" id="seg" role="tablist" style="margin-top:12px"></div>
    <div class="card list" id="list" style="margin-top:12px"></div>
    <div id="msg" style="margin-top:12px"></div>
    <div class="foot" style="margin-top:12px"><button id="btnOpen">교사 화면 열기</button></div>
    <div class="foot" style="margin-top:8px" id="androidRow" hidden><button id="btnAndroid">안드로이드 홈 화면 위젯에 연결</button></div>
  </main>

  <section class="card set" id="settings" hidden>
    <h2>연결 설정</h2>
    <p>교사 화면 오른쪽 위 <b>위젯</b> → <b>연결 코드 만들기</b>에서 받은 코드를 붙여 넣어 주세요. 코드는 이 기기에만 저장돼요.</p>
    <input type="text" id="code" placeholder="ew1.…" autocomplete="off" spellcheck="false">
    <div class="foot" style="margin:10px 0 6px"><button class="pri" id="btnSave">연결</button><button id="btnClear">연결 끊기</button><button id="btnBack">닫기</button></div>
    <div id="setMsg"></div>
    <div id="appOpts" hidden>
      <label class="opt"><span>항상 위에 띄우기<small>다른 창보다 앞에 보여요</small></span><input type="checkbox" class="sw" id="optTop"></label>
      <label class="opt"><span>컴퓨터 켜면 자동 실행<small>로그인하면 트레이(메뉴 막대)에 바로 떠요</small></span><input type="checkbox" class="sw" id="optAuto"></label>
      <label class="opt"><span>채점 대기가 늘면 알림<small>새 제출이 들어오면 알려 줘요</small></span><input type="checkbox" class="sw" id="optNotify"></label>
    </div>
  </section>
</div>
<script>
const SITE = 'https://eng-test.allforedu.kr';
const TAURI = window.__TAURI__ || null;
const BASE = /^https?:$/.test(location.protocol) && !TAURI ? '' : SITE;
const LS = { code: 'engw-code', grade: 'engw-grade', notify: 'engw-notify', top: 'engw-top', last: 'engw-lastwait' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let DATA = null, BUSY = false, GRADE = localStorage.getItem(LS.grade) || 'all';
const ICON_WARN = '<svg viewBox="0 0 24 24"><path d="m10.3 3.9-8.2 14a2 2 0 0 0 1.7 3h16.4a2 2 0 0 0 1.7-3l-8.2-14a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';
const ICON_OK = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
const timeText = (iso) => new Date(iso).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });

function sum(list) { return list.reduce((a, x) => ({ wait: a.wait + x.wait, aiSuggest: a.aiSuggest + x.aiSuggest, unpub: a.unpub + x.unpub, today: a.today + x.today }), { wait: 0, aiSuggest: 0, unpub: 0, today: 0 }); }
function draw() {
  const d = DATA;
  if (!d) return;
  const grades = d.grades.filter((g) => g.classes.length);
  if (GRADE !== 'all' && !grades.some((g) => String(g.grade) === GRADE)) GRADE = 'all';
  const shown = GRADE === 'all' ? grades : grades.filter((g) => String(g.grade) === GRADE);
  const t = sum(shown.map((g) => g.total));
  $('#bigWait').textContent = t.wait; $('#bigWait').classList.toggle('on', t.wait > 0);
  $('#cAi').textContent = t.aiSuggest; $('#cUnpub').textContent = t.unpub; $('#cToday').textContent = t.today;
  $('#seg').innerHTML = [['all', '전체', sum(grades.map((g) => g.total)).wait], ...grades.map((g) => [String(g.grade), g.grade + '학년', g.total.wait])]
    .map(([k, name, w]) => `<button role="tab" data-g="${k}" class="${GRADE === k ? 'on' : ''}" aria-selected="${GRADE === k}">${name}${w ? `<small>${w}</small>` : ''}</button>`).join('');
  $('#seg').querySelectorAll('button').forEach((b) => (b.onclick = () => { GRADE = b.dataset.g; localStorage.setItem(LS.grade, GRADE); draw(); }));
  const rows = shown.flatMap((g) => g.classes.map((c) => ({ ...c, grade: g.grade })));
  const n = (v, hot) => `<span class="n ${v ? 'v' : ''} ${v && hot ? 'hot' : ''}">${v || '·'}</span>`;
  $('#list').innerHTML = rows.length
    ? `<div class="row head"><span>반</span><span class="n">대기</span><span class="n">AI</span><span class="n">미공개</span><span class="n">오늘</span></div>` +
      rows.map((c) => `<button type="button" class="row" data-g="${c.grade}" data-c="${c.class_no}" data-go="${c.wait ? 'wait' : c.unpub ? 'unpub' : 'grades'}" title="${c.grade}학년 ${c.class_no}반 ${c.wait ? '채점 대기' : c.unpub ? '피드백 미공개' : '성적표'} 열기"><span class="cls">${c.grade}-${c.class_no}<small>${c.students}명</small></span>${n(c.wait, true)}${n(c.aiSuggest)}${n(c.unpub)}${n(c.today)}</button>`).join('')
    : '<div class="empty">아직 학생이 없어요</div>';
  $('#list').querySelectorAll('button.row').forEach((b) => (b.onclick = () => openTeacher(`/teacher?g=${b.dataset.g}&c=${b.dataset.c}&go=${b.dataset.go}`)));
  $('#msg').innerHTML = d.errors24h > 0 ? `<div class="note err">${ICON_WARN}<span>최근 24시간 오류 ${d.errors24h}건 — 교사 화면에서 확인해 주세요</span></div>` : '';
  $('#sub').textContent = `${d.label ? d.label + ' · ' : ''}${timeText(d.at)} 기준`;
  tray(sum(grades.map((g) => g.total)));
}

async function tray(t) {
  if (!TAURI) return;
  try { await TAURI.core.invoke('set_tray', { title: t.wait ? String(t.wait) : '', tooltip: `영어 채점 — 대기 ${t.wait} · AI ${t.aiSuggest} · 미공개 ${t.unpub}` }); } catch {}
  const last = +(localStorage.getItem(LS.last) || 0);
  localStorage.setItem(LS.last, String(t.wait));
  if (t.wait > last && localStorage.getItem(LS.notify) === '1') {
    try {
      const n = TAURI.notification; let ok = await n.isPermissionGranted();
      if (!ok) ok = (await n.requestPermission()) === 'granted';
      if (ok) n.sendNotification({ title: '영어 채점', body: `채점 대기가 ${t.wait - last}건 늘었어요 (모두 ${t.wait}건)` });
    } catch {}
  }
}

async function load(manual) {
  const code = localStorage.getItem(LS.code);
  if (!code) { showSettings(); return; }
  if (BUSY) return; BUSY = true; $('#btnRefresh').classList.add('spin');
  try {
    const r = await fetch(BASE + '/api/w/summary', { headers: { authorization: 'Bearer ' + code }, cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) throw new Error(j.error || '연결 코드가 맞지 않거나 끊겼어요');
    if (!r.ok) throw new Error(j.error || `사이트 응답이 올바르지 않아요 (${r.status})`);
    DATA = j; draw();
  } catch (e) {
    const m = e instanceof TypeError ? '인터넷 연결을 확인해 주세요' : e.message;
    $('#msg').innerHTML = `<div class="note err">${ICON_WARN}<span>${esc(m)}</span></div>`;
    if (!DATA) $('#sub').textContent = '불러오지 못했어요';
    if (manual === 'save') throw e;
  } finally { BUSY = false; $('#btnRefresh').classList.remove('spin'); }
}

function showSettings() { $('#view').hidden = true; $('#settings').hidden = false; $('#code').value = localStorage.getItem(LS.code) || ''; $('#setMsg').innerHTML = ''; }
function hideSettings() { if (!localStorage.getItem(LS.code)) return; $('#settings').hidden = true; $('#view').hidden = false; }
$('#btnSet').onclick = () => ($('#settings').hidden ? showSettings() : hideSettings());
$('#btnBack').onclick = hideSettings;
$('#btnRefresh').onclick = () => load(true);
$('#btnSave').onclick = async () => {
  const c = $('#code').value.trim();
  if (!/^ew1\.[A-Za-z0-9_-]{40,}$/.test(c)) { $('#setMsg').innerHTML = `<div class="note err">${ICON_WARN}<span>코드 모양이 달라요. ew1. 로 시작하는 코드를 통째로 붙여 넣어 주세요.</span></div>`; return; }
  localStorage.setItem(LS.code, c); localStorage.removeItem(LS.last); keepInUrl(c);
  try { await load('save'); $('#setMsg').innerHTML = `<div class="note ok">${ICON_OK}<span>연결됐어요</span></div>`; setTimeout(hideSettings, 700); }
  catch (e) { $('#setMsg').innerHTML = `<div class="note err">${ICON_WARN}<span>${esc(e instanceof TypeError ? '인터넷 연결을 확인해 주세요' : e.message)}</span></div>`; }
};
$('#btnClear').onclick = () => { keepInUrl(''); localStorage.removeItem(LS.code); localStorage.removeItem(LS.last); DATA = null; $('#code').value = ''; $('#sub').textContent = '연결 코드를 넣어 주세요'; tray({ wait: 0, aiSuggest: 0, unpub: 0 }); $('#setMsg').innerHTML = `<div class="note ok">${ICON_OK}<span>이 기기에서 코드를 지웠어요. 교사 화면에서도 '끊기'를 눌러 주세요.</span></div>`; };
// 교사 화면 열기: 데스크탑 앱은 설치한 '영어 교사' 앱(PWA)을 먼저 찾아 열고, 없으면 브라우저로
// path: '/teacher' 또는 반 바로 열기 '/teacher?g=4&c=5&go=wait'
async function openTeacher(path) {
  const u = SITE + path;
  if (!TAURI) {
    // 휴대폰에 앱으로 설치한 위젯: 같은 앱 안에서 교사 화면으로 (교사 화면에 '← 위젯' 버튼이 생김)
    if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) { sessionStorage.setItem('engw-from', '1'); location.href = path; return; }
    window.open(u, '_blank'); return;
  }
  // 설치한 교사 앱은 시작 주소로만 열려서, 반 바로 열기는 브라우저 주소로
  if (path === '/teacher') try { if (await TAURI.core.invoke('open_teacher')) return; } catch {}
  if (TAURI.opener) TAURI.opener.openUrl(u).catch(() => {});
}
$('#btnOpen').onclick = () => openTeacher('/teacher');

// 앱(Tauri)에서만: 항상 위·자동 실행·알림
if (TAURI) {
  $('#appOpts').hidden = false;
  const win = TAURI.window.getCurrentWindow();
  const top = localStorage.getItem(LS.top) === '1'; $('#optTop').checked = top; win.setAlwaysOnTop(top).catch(() => {});
  $('#optTop').onchange = (e) => { localStorage.setItem(LS.top, e.target.checked ? '1' : '0'); win.setAlwaysOnTop(e.target.checked).catch(() => {}); };
  TAURI.autostart.isEnabled().then((v) => ($('#optAuto').checked = v)).catch(() => {});
  $('#optAuto').onchange = (e) => (e.target.checked ? TAURI.autostart.enable() : TAURI.autostart.disable()).catch(() => {});
  $('#optNotify').checked = localStorage.getItem(LS.notify) === '1';
  $('#optNotify').onchange = async (e) => {
    localStorage.setItem(LS.notify, e.target.checked ? '1' : '0');
    if (e.target.checked) { try { if (!(await TAURI.notification.isPermissionGranted())) await TAURI.notification.requestPermission(); } catch {} }
  };
}

// 휴대폰: 주소 /teacher/w#k=코드 로 열면 저장하고 주소에도 남겨 둠 → '홈 화면에 추가'한 아이콘에 코드가 담겨,
// 휴대폰이 사이트 저장소를 지워도 아이콘으로 열면 다시 연결됨 (# 뒤는 서버로 가지 않음)
function keepInUrl(c) {
  if (TAURI || !/^https?:$/.test(location.protocol)) return;
  history.replaceState(null, '', location.pathname + (c ? '#k=' + c : ''));
  const mf = document.getElementById('mf'); if (mf) mf.href = '/teacher/w.webmanifest' + (c ? '?k=' + encodeURIComponent(c) : '');   // 앱 설치 시작 주소에도 코드
}
{ const m = location.hash.match(/k=(ew1\.[A-Za-z0-9_-]{40,})/);
  if (m) { if (localStorage.getItem(LS.code) !== m[1]) { localStorage.setItem(LS.code, m[1]); localStorage.removeItem(LS.last); } keepInUrl(m[1]); }
  else if (localStorage.getItem(LS.code)) keepInUrl(localStorage.getItem(LS.code)); }

// 안드로이드(영어 교사 앱 설치됨): 이 기기에 저장된 연결 코드를 앱의 홈 화면 위젯에 넘김
if (!TAURI && /Android/i.test(navigator.userAgent)) {
  $('#androidRow').hidden = false;
  $('#btnAndroid').onclick = () => {
    const c = localStorage.getItem(LS.code) || '';
    if (!c) { showSettings(); return; }
    location.href = 'intent://connect?k=' + encodeURIComponent(c) + '#Intent;scheme=engtestw;package=kr.allforedu.engtest.app;S.browser_fallback_url=' + encodeURIComponent(location.origin + '/teacher/w') + ';end';
  };
}

load();
setInterval(() => { if (!document.hidden || TAURI) load(); }, 2 * 60 * 1000);   // 2분마다
document.addEventListener('visibilitychange', () => { if (!document.hidden && DATA && Date.now() - Date.parse(DATA.at) > 60e3) load(); });
</script>
</body>
