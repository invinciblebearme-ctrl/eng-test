<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>교사용 · 2학기 영어 채점</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/xlsx.js" defer></script>
<script src="/qr.js"></script>
</head>
<body>
<header class="top"><div class="wrap"><h1><span class="dag">†</span> 교사용 · 2학기 영어</h1>
  <div class="tabs" id="nav" hidden><button class="tab on" data-v="grades">채점·성적</button><button class="tab" data-v="roster">명렬표</button><button class="tab" data-v="key">문제·정답</button><button class="tab" data-v="links">🔓 시험 열기·링크</button><button class="tab" data-v="review">✅ 검토·공개</button><button class="tab" data-v="reports">📊 분석</button></div>
  <button id="out" class="btn sm ghost" hidden>로그아웃</button></div></header>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<div id="printArea" class="result"></div>
<script src="/common.js"></script>
<script>
const app = $('#app');
const LS = 'eng4-teacher';
let GROUP = localStorage.getItem('eng4-grp') || 'concept', UNITF = localStorage.getItem('eng4-unitf') || 'all', RSUB = 'list', KEYSEL = null;
let GRADE = +(localStorage.getItem('eng4-grade') || 4), CLASS_COUNT = { 3: 7, 4: 6 };
let TOKEN = localStorage.getItem(LS), KEY = null, CLS = +(localStorage.getItem('eng4-cls') || 1), VIEW = 'grades', timer = null;
const T = (path, body) => api(path, body, TOKEN).catch((e) => { if (e.status === 401) { logout(); } throw e; });

function logout() { localStorage.removeItem(LS); TOKEN = null; $('#nav').hidden = true; $('#out').hidden = true; login(); }
$('#out').onclick = logout;
$('#nav').onclick = (e) => { const v = e.target.dataset.v; if (v) go(v); };

function login(msg) {
  app.innerHTML = `<div class="center-screen"><h2>교사 로그인</h2><p class="lead">3·4학년 2학기 영어 채점</p>
  <form id="f" class="card"><label class="small muted">교사 비밀번호</label>
    <input type="password" id="pw" class="field" autofocus style="width:100%;font-size:19px;margin:4px 0 14px">
    ${msg ? `<div class="notice">${esc(msg)}</div>` : ''}
    <button class="btn pri" style="width:100%;margin-top:6px">들어가기</button></form></div>`;
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    try { TOKEN = (await api('/api/teacher/login', { password: $('#pw').value })).token; localStorage.setItem(LS, TOKEN); boot(); }
    catch (err) { login(err.message); }
  };
}
async function boot() {
  MEDIA_TOKEN = TOKEN;
  try { KEY = (await T('/api/t/key')).concepts;
    try { for (const v of Object.values((await T('/api/t/roster-check')).classes)) CLASS_COUNT[v.grade] = Math.max(CLASS_COUNT[v.grade] || 0, v.class_no); } catch {} } catch (e) { if (e.status !== 401) app.innerHTML = `<div class="notice">${esc(e.message)}</div>`; return; }
  await loadClosed();
  $('#nav').hidden = false; $('#out').hidden = false; go('grades');
}
// ---------------- ✅ 검토·공개: 틀린 문제와 AI 피드백을 한눈에 보고 확정·공개 ----------------
const RV = { cls: null, set: 'all', state: localStorage.getItem('eng4-rvstate') || 'wait', mode: localStorage.getItem('eng4-rvmode') || 'group', data: null, sel: new Set(), focus: 0, row: 0 };
const normAns = (t) => String(t ?? '').replace(/\s+/g, ' ').trim();
async function reviewView() {
  if (RV.cls == null) RV.cls = CLS;
  const sets = KG();
  app.innerHTML = `<div class="ctx">${gradeTabs()}<span class="sep"></span><div class="tabs"><button class="tab ${RV.cls === 0 ? 'on' : ''}" data-rcls="0">전체 반</button>${Array.from({ length: CLASS_COUNT[GRADE] || 6 }, (_, i) => i + 1).map((n) => `<button class="tab ${n === RV.cls ? 'on' : ''}" data-rcls="${n}">${n}반</button>`).join('')}</div></div>
    <div class="bar view" style="flex-wrap:wrap;gap:8px">
      <select id="rvSet" class="field"><option value="all">모든 시험</option><option value="concept" ${RV.set === 'concept' ? 'selected' : ''}>📘 기본 개념 전체</option>${sets.map((c) => `<option value="${c.id}" ${String(RV.set) === String(c.id) ? 'selected' : ''}>${esc(setTitle(c))}</option>`).join('')}</select>
      <div class="tabs seg">${[['wait', '채점 대기'], ['unpub', '확정·피드백 미공개'], ['all', '전체']].map(([k, t]) => `<button class="tab ${RV.state === k ? 'on' : ''}" data-rst="${k}">${t}</button>`).join('')}</div>
      <span style="flex:1"></span>
      <div class="tabs seg">${[['group', '🧩 문항별 묶음'], ['card', '🧑‍🎓 학생별 카드']].map(([k, t]) => `<button class="tab ${RV.mode === k ? 'on' : ''}" data-rmode="${k}">${t}</button>`).join('')}</div>
    </div>
    <div id="rvBody"><p class="muted">불러오는 중…</p></div>`;
  app.querySelectorAll('[data-grade]').forEach((b) => (b.onclick = () => { GRADE = +b.dataset.grade; localStorage.setItem('eng4-grade', GRADE); RV.set = 'all'; RV.sel.clear(); reviewView(); }));
  app.querySelectorAll('[data-rcls]').forEach((b) => (b.onclick = () => { RV.cls = +b.dataset.rcls; RV.sel.clear(); reviewView(); }));
  app.querySelectorAll('[data-rst]').forEach((b) => (b.onclick = () => { RV.state = b.dataset.rst; localStorage.setItem('eng4-rvstate', RV.state); RV.sel.clear(); reviewView(); }));
  app.querySelectorAll('[data-rmode]').forEach((b) => (b.onclick = () => { RV.mode = b.dataset.rmode; localStorage.setItem('eng4-rvmode', RV.mode); RV.focus = 0; drawReview(); }));
  $('#rvSet').onchange = () => { RV.set = $('#rvSet').value; RV.sel.clear(); reviewView(); };
  const ids = RV.set === 'all' ? [] : RV.set === 'concept' ? sets.filter((c) => c.kind === 'concept').map((c) => c.id) : [+RV.set];
  const my = ++DRAW_SEQ;
  let d; try { d = await T(`/api/t/review?grade=${GRADE}&class=${RV.cls || ''}&state=${RV.state}&concepts=${ids.join(',')}`); } catch (e) { $('#rvBody').innerHTML = `<div class="notice">${esc(e.message)}</div>`; return; }
  if (my !== DRAW_SEQ || VIEW !== 'review') return;
  const stBy = Object.fromEntries(d.students.map((x) => [x.id, x]));
  const order = Object.fromEntries(sets.map((c, k) => [c.id, k]));
  RV.data = d.items.map((r) => {
    const c = KEY.find((x) => x.id === r.concept), st = stBy[r.student_id];
    const marks = c.questions.map((_, i) => (r.overrides && r.overrides[i] != null ? !!r.overrides[i] : !!r.auto[i]));
    const wrong = c.questions.map((qq, i) => ((!r.auto[i] || !marks[i]) && qq.a != null ? i : -1)).filter((i) => i >= 0);
    return { ...r, c, st, marks, wrong };
  }).filter((r) => r.st).sort((a, b) => a.st.class_no - b.st.class_no || a.st.number - b.st.number || order[a.concept] - order[b.concept]);
  drawReview();
}
const rvScore = (r) => r.marks.filter(Boolean).length;
const rvWarn = (r) => r.feedback_draft && !r.feedback && r.wrong.some((i) => r.marks[i] && !r.auto[i] && r.feedback_draft.includes(`${i + 1}번`));
function rvGroups() {
  const m = new Map();
  for (const r of RV.data) for (const i of r.wrong) {
    const q = r.c.questions[i], ans = normAns(answerToText(q, r.answers[i])) || '(빈칸)', k = `${r.concept}:${i}:${ans}`;
    if (!m.has(k)) m.set(k, { k, c: r.c, i, q, ans, items: [] });
    m.get(k).items.push(r);
  }
  const order = Object.fromEntries(KG().map((c, k) => [c.id, k]));
  return [...m.values()].sort((a, b) => order[a.c.id] - order[b.c.id] || a.i - b.i || b.items.length - a.items.length);
}
function drawReview() {
  const el = $('#rvBody'); if (!el || !RV.data) return;
  const items = RV.data, rev = items.filter((r) => r.reviewed_at).length;
  const head = `<div class="rvhead"><b>${items.length}건</b> <span class="muted small">· 틀린 문항 ${items.reduce((a, r) => a + r.wrong.length, 0)}개 · 💬 초안 ${items.filter((r) => r.feedback_draft && !r.feedback).length}건 · 검토함 ${rev}/${items.length}</span><div class="rvprog"><i style="width:${items.length ? Math.round(rev / items.length * 100) : 0}%"></i></div></div>`;
  const keys = RV.mode === 'group' ? 'J/K 묶음 이동 · O/X 이 묶음 전체 채점' : 'J/K 카드 이동 · ↑/↓ 문항 · O/X 채점 · Space 선택 · E 피드백 고치기 · R 검토함';
  let body;
  if (!items.length) body = `<div class="notice">${RV.state === 'wait' ? '채점 대기 중인 답이 없어요.' : RV.state === 'unpub' ? '공개를 기다리는 피드백 초안이 없어요.' : '제출한 답이 없어요.'}</div>`;
  else if (RV.mode === 'group') {
    const gs = rvGroups();
    body = gs.length ? gs.map((g, k) => {
      const allO = g.items.every((r) => r.marks[g.i]), allX = g.items.every((r) => !r.marks[g.i]);
      const ai = g.items.map((r) => r.ai && r.ai[g.i]).filter(Boolean), aiOk = ai.filter((x) => x.ok).length;
      return `<div class="rvg ${k === RV.focus ? 'focus' : ''}" data-k="${k}">
        <div class="rvq"><span class="badge">${esc(qLabel(g.c))} ${g.i + 1}번</span> ${optLabel(g.q.q)}${qExtra(g.q)}</div>
        <div class="rvrow"><div><span class="muted small">학생 답</span><div class="stu big">${optLabel(g.ans)}</div></div><div><span class="muted small">정답</span><div>${optLabel(g.q.answerText)}</div></div>
          <div class="cnt"><b>${g.items.length}</b>명</div>
          <div class="ox"><button class="o ${allO ? 'on' : ''}" data-gv="1">O</button><button class="x ${allX ? 'on' : ''}" data-gv="0">X</button></div></div>
        ${ai.length ? `<div class="small" style="color:${aiOk ? 'var(--ok)' : 'var(--muted)'}">🤖 AI: O ${aiOk} · X ${ai.length - aiOk} — ${esc(ai[0].reason)}</div>` : ''}
        <div class="names">${g.items.map((r) => `<button class="nm ${r.marks[g.i] ? 'o' : ''}" data-open="${r.id}" title="눌러서 답 전체 보기">${r.st.class_no}-${r.st.number} ${esc(r.st.name)}</button>`).join('')}</div></div>`;
    }).join('') : '<div class="notice ok">틀린 문항이 없어요. 아래에서 바로 확정할 수 있어요.</div>';
  } else {
    body = items.map((r, k) => {
      const sc = rvScore(r), tot = r.c.questions.length, sel = RV.sel.has(r.id);
      const top = `<label class="rvtop"><input type="checkbox" data-sel="${r.id}" ${sel ? 'checked' : ''}> <b>${r.st.class_no}반 ${r.st.number}번 ${esc(r.st.name)}</b> <span class="muted">· ${esc(qLabel(r.c))} ${r.c.kind === 'concept' ? esc(r.c.title) : ''}</span> <b class="sc ${sc === tot ? 'ok' : sc >= tot * 0.8 ? '' : 'low'}">${sc}/${tot}</b>
        <span class="badge ${r.status === 'graded' ? 'ok' : 'wait'}">${r.status === 'graded' ? '확정됨' : '채점 대기'}</span>${r.reviewed_at ? ' <span class="badge ok">✓ 검토함</span>' : ''}${rvWarn(r) ? ' <span class="badge no">⚠️ 피드백 확인 필요</span>' : ''}</label>`;
      if (!r.wrong.length && !(r.feedback_draft && !r.feedback)) return `<div class="rvc slim ${k === RV.focus ? 'focus' : ''}" data-k="${k}" data-id="${r.id}">${top}<span class="muted small">만점 · 피드백 초안 없음</span></div>`;
      return `<div class="rvc ${k === RV.focus ? 'focus' : ''}" data-k="${k}" data-id="${r.id}">${top}
        ${r.wrong.map((i, j) => { const q = r.c.questions[i]; return `<div class="rvrow ${k === RV.focus && j === RV.row ? 'rowf' : ''}"><div class="n">${i + 1}</div><div class="small">${optLabel(q.q)}</div><div class="stu">${optLabel(answerToText(q, r.answers[i])) || '<span class="muted">(빈칸)</span>'}</div><div>${optLabel(q.answerText)}</div>
          <div class="ox"><button class="o ${r.marks[i] ? 'on' : ''}" data-i="${i}" data-v="1">O</button><button class="x ${!r.marks[i] ? 'on' : ''}" data-i="${i}" data-v="0">X</button></div></div>${r.ai && r.ai[i] ? `<div class="small rvai" style="color:${r.ai[i].ok ? 'var(--ok)' : 'var(--muted)'}">🤖 AI: ${r.ai[i].ok ? 'O' : 'X'} — ${esc(r.ai[i].reason)}</div>` : ''}`; }).join('')}
        ${r.feedback ? `<div class="notice ok small" style="margin:8px 0 0">💬 공개됨: ${esc(r.feedback)}</div>` : `<textarea class="rvfb" data-fb="${r.id}" placeholder="피드백 초안이 없어요. 직접 써도 돼요.">${esc(r.feedback_draft || '')}</textarea>`}
        <div class="bar" style="margin:6px 0 0"><span class="small muted" data-saved="${r.id}"></span><span style="flex:1"></span><button class="btn sm" data-rev="${r.id}">${r.reviewed_at ? '↺ 검토 취소' : '✓ 검토함'}</button><button class="btn sm ghost" data-open="${r.id}">자세히</button></div></div>`;
    }).join('');
  }
  const selN = RV.sel.size, selItems = items.filter((r) => RV.sel.has(r.id));
  el.innerHTML = `${head}<p class="small muted">⌨ ${keys}</p>${body}
    <div class="rvbar"><b>선택 ${selN}건</b><button class="btn sm" id="rvPerfect">만점 선택</button><button class="btn sm" id="rvAll">전체 선택</button><button class="btn sm ghost" id="rvNone">해제</button><span style="flex:1"></span>
      <button class="btn sm" id="rvPub" ${selItems.some((r) => r.feedback_draft && !r.feedback) ? '' : 'disabled'}>💬 피드백만 공개</button>
      <button class="btn pri" id="rvGo" ${selN ? '' : 'disabled'}>✔ 선택 ${selN}건 확정 + 피드백 공개</button></div>`;
  bindReview();
}
async function rvMark(r, i, v) {
  r.marks[i] = v;
  const overrides = {}; r.marks.forEach((m, j) => { if (m !== !!r.auto[j]) overrides[j] = m; });
  r.overrides = overrides;
  try { await T('/api/t/review-save', { id: r.id, overrides }); } catch (e) { alert(e.message); }
}
async function rvGroupMark(g, v) {
  const ids = g.items.map((r) => r.id);
  try { await T('/api/t/bulk-override', { ids, i: g.i, value: v }); } catch (e) { return alert(e.message); }
  g.items.forEach((r) => { r.marks[g.i] = v; const o = { ...(r.overrides || {}) }; if (!!r.auto[g.i] === v) delete o[g.i]; else o[g.i] = v; r.overrides = o; });
  toast(`${ids.length}명 ${g.i + 1}번을 ${v ? 'O' : 'X'}로 바꿨어요`);
  drawReview();
}
let RV_T = {};
function bindReview() {
  const el = $('#rvBody'), items = RV.data, byId = Object.fromEntries(items.map((r) => [r.id, r]));
  const gs = RV.mode === 'group' ? rvGroups() : null;
  el.querySelectorAll('[data-open]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); openSub(+b.dataset.open); }));
  if (gs) el.querySelectorAll('.rvg').forEach((g) => g.querySelectorAll('[data-gv]').forEach((b) => (b.onclick = () => { RV.focus = +g.dataset.k; rvGroupMark(gs[+g.dataset.k], b.dataset.gv === '1'); })));
  el.querySelectorAll('.rvc[data-id]').forEach((card) => {
    const r = byId[+card.dataset.id];
    card.querySelectorAll('.ox button').forEach((b) => (b.onclick = async () => { RV.focus = +card.dataset.k; await rvMark(r, +b.dataset.i, b.dataset.v === '1'); drawReview(); }));
  });
  el.querySelectorAll('[data-sel]').forEach((x) => (x.onchange = () => { x.checked ? RV.sel.add(+x.dataset.sel) : RV.sel.delete(+x.dataset.sel); drawReview(); }));
  el.querySelectorAll('[data-fb]').forEach((ta) => (ta.oninput = () => {
    const id = +ta.dataset.fb, r = byId[id]; r.feedback_draft = ta.value;
    const tag = el.querySelector(`[data-saved="${id}"]`); if (tag) tag.textContent = '저장 중…';
    clearTimeout(RV_T[id]); RV_T[id] = setTimeout(async () => { try { await T('/api/t/review-save', { id, feedback_draft: ta.value }); if (tag) tag.textContent = '✓ 저장됨'; } catch (e) { if (tag) tag.textContent = '저장 실패: ' + e.message; } }, 700);
  }));
  el.querySelectorAll('[data-rev]').forEach((b) => (b.onclick = async () => { const r = byId[+b.dataset.rev], on = !r.reviewed_at; await T('/api/t/review-save', { id: r.id, reviewed: on }); r.reviewed_at = on ? new Date().toISOString() : null; drawReview(); }));
  $('#rvPerfect').onclick = () => { items.forEach((r) => rvScore(r) === r.c.questions.length && RV.sel.add(r.id)); drawReview(); };
  $('#rvAll').onclick = () => { items.forEach((r) => RV.sel.add(r.id)); drawReview(); };
  $('#rvNone').onclick = () => { RV.sel.clear(); drawReview(); };
  const commit = async (grade) => {
    const sel = items.filter((r) => RV.sel.has(r.id));
    const toGrade = grade ? sel.filter((r) => r.status !== 'graded').length : 0, toPub = sel.filter((r) => r.feedback_draft && !r.feedback).length, warn = sel.filter(rvWarn).length;
    const names = new Set(sel.map((r) => r.student_id)).size;
    if (!confirm(`${names}명 · ${sel.length}건\n- 확정: ${toGrade}건\n- 피드백 공개: ${toPub}건${warn ? `\n\n⚠️ 피드백 확인이 필요한 카드가 ${warn}건 있어요. 그래도 진행할까요?` : ''}\n\n학생이 바로 결과와 피드백을 볼 수 있어요.`)) return;
    $('#rvGo').disabled = true;
    try { const r = await T('/api/t/review-commit', { ids: sel.map((x) => x.id), publish: true, grade }); toast(`확정 ${r.graded}건 · 피드백 공개 ${r.published}건`); RV.sel.clear(); reviewView(); }
    catch (e) { alert(e.message); $('#rvGo').disabled = false; }
  };
  $('#rvGo').onclick = () => commit(true);
  $('#rvPub').onclick = () => commit(false);
  // 키보드
  document.onkeydown = (e) => {
    if (VIEW !== 'review' || $('#modal').innerHTML || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { if (e.key === 'Escape') document.activeElement.blur(); return; }
    const n = gs ? gs.length : items.length; if (!n) return;
    const k = e.key.toLowerCase(), move = (d) => { RV.focus = Math.max(0, Math.min(n - 1, RV.focus + d)); RV.row = 0; drawReview(); const f = $('#rvBody .focus'); if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
    if (k === 'j') { e.preventDefault(); move(1); }
    else if (k === 'k') { e.preventDefault(); move(-1); }
    else if (gs && (k === 'o' || k === 'x')) rvGroupMark(gs[RV.focus], k === 'o');
    else if (!gs) {
      const r = items[RV.focus]; if (!r) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); RV.row = Math.max(0, Math.min(r.wrong.length - 1, RV.row + (e.key === 'ArrowDown' ? 1 : -1))); drawReview(); }
      else if ((k === 'o' || k === 'x') && r.wrong.length) rvMark(r, r.wrong[Math.min(RV.row, r.wrong.length - 1)], k === 'o').then(drawReview);
      else if (e.key === ' ') { e.preventDefault(); RV.sel.has(r.id) ? RV.sel.delete(r.id) : RV.sel.add(r.id); drawReview(); }
      else if (k === 'e') { const ta = $(`[data-fb="${r.id}"]`); if (ta) { e.preventDefault(); ta.focus(); } }
      else if (k === 'r') { const b = $(`[data-rev="${r.id}"]`); if (b) b.click(); }
    }
  };
}
// ---------------- 분석 (Claude 예약 작업이 남긴 보고서) ----------------
async function reportsView() {
  app.innerHTML = `<div class="ctx">${gradeTabs()}</div><h2>📊 결과 분석</h2>
    <p class="small muted">Claude 예약 작업이 정해진 시간마다 학생 답을 살펴보고 남긴 보고서예요. 같은 작업이 애매한 답에 🤖 O/X 제안을, 학생별로 💬 피드백 초안을 남겨요. 모두 <b>선생님이 확정하기 전에는 학생에게 보이지 않아요.</b></p>
    <div id="rp"><p class="muted">불러오는 중…</p></div>`;
  bindCls(reportsView);
  let d; try { d = await T('/api/t/reports?grade=' + GRADE); } catch (e) { $('#rp').innerHTML = `<div class="notice">${esc(e.message)}</div>`; return; }
  const md = (t) => esc(t).replace(/^### (.*)$/gm, '<h4>$1</h4>').replace(/^## (.*)$/gm, '<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^- (.*)$/gm, '• $1');

function downloadCSV(d, by) {
  const ids = KG().map((c) => c.id), totalOf = (cid) => KEY.find((c) => c.id === cid).questions.length;
  const rows = [['학년', '반', '번호', '이름', ...KG().map((c) => `${c.short}(${c.questions.length})`), '제출 수', '정답률(%)']];
  d.students.forEach((s) => {
    const sc = ids.map((cid) => { const x = by[s.id + ':' + cid]; return x ? x.score + (x.status !== 'graded' ? '(대기)' : '') : ''; });
    const got = ids.map((cid) => by[s.id + ':' + cid]).filter(Boolean);
    rows.push([GRADE, CLS, s.number, s.name, ...sc, got.length, got.length ? Math.round(got.reduce((a, b) => a + b.score / totalOf(b.concept), 0) / got.length * 100) : '']);
  });
  const csv = '﻿' + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${GRADE}학년${CLS}반_영어_성적.csv`; a.click();
}

      <p class="small muted">${st.undo ? '확정된 결과를 다시 <b>채점 대기</b>로 돌려요. 학생 화면에서 결과가 다시 숨겨져요. (점수·O/X 수정 내용은 그대로)' : '채점 대기 중인 결과를 <b>지금 보이는 점수 그대로</b> 확정해요. 확정하면 학생이 결과를 볼 수 있어요.'}</p>

        ${st.undo ? '' : `<b style="margin-left:10px">조건</b><select id="cfFilter" class="field">
          <option value="all" ${st.filter === 'all' ? 'selected' : ''}>대기 중인 것 모두</option>

          <option value="ai" ${st.filter === 'ai' ? 'selected' : ''}>🤖 AI 채점을 마친 것(+만점)만</option></select>`}</div>
      <div class="bar" style="margin:4px 0 6px"><b style="flex:1">시험 (${st.sel.size})</b><button class="btn sm" id="cfAll">대상 있는 것 전체</button><button class="btn sm ghost" id="cfNone">선택 해제</button></div>

      ${st.undo ? '' : `<label class="small" style="display:block;margin:6px 0"><input type="checkbox" id="cfDraft" ${st.useDraft ? 'checked' : ''}> 💬 AI 피드백 초안도 함께 학생에게 공개 (선생님이 쓴 말이 없는 것만)</label>`}
      <div class="bar"><span class="small">${st.undo ? '확정 취소' : '확정'}할 결과 <b style="font-size:18px">${total}건</b></span><span style="flex:1"></span>

function openReissue(visibleIds, d, by) {
  const m = $('#modal'), totalOf = (cid) => KEY.find((c) => c.id === cid).questions.length;
  const sets = KG().filter((c) => d.students.some((st) => by[st.id + ':' + c.id]));
  if (!sets.length) return alert('이 반에서 제출된 시험이 아직 없어요.');
  let cid = (sets.find((c) => visibleIds.includes(c.id)) || sets[0]).id;
  const sel = new Set();
  const draw = () => {
    const c = KEY.find((x) => x.id === cid), n = totalOf(cid);
    const subs = d.students.map((st) => ({ st, x: by[st.id + ':' + cid] })).filter((r) => r.x);
    m.innerHTML = `<div class="modal" id="bg"><div class="box">
      <div class="bar" style="margin-top:0"><b style="font-size:20px;flex:1">🔁 ${GRADE}학년 ${CLS}반 재출제</b><button class="btn sm" id="x">닫기</button></div>
      <p class="small muted">고른 학생의 지금 답과 점수는 <b>이전 기록(1차, 2차…)</b>으로 남기고, 같은 시험을 처음부터 다시 풀게 해요.</p>
      <label class="small muted">시험</label>
      <select id="rsSet" class="field" style="width:100%;margin:4px 0 12px">${sets.map((x) => `<option value="${x.id}" ${x.id === cid ? 'selected' : ''}>${esc(qLabel(x))} · ${esc(x.title)} (${d.students.filter((st) => by[st.id + ':' + x.id]).length}명 제출)</option>`).join('')}</select>
      <div class="bar" style="margin:0 0 6px"><b style="flex:1">학생 (${sel.size}/${subs.length})</b>
        <button class="btn sm" data-pick="all">제출한 학생 전체</button><button class="btn sm" data-pick="low">80% 미만만</button><button class="btn sm ghost" data-pick="none">선택 해제</button></div>
      <div class="pplist">${subs.map(({ st, x }) => `<label><input type="checkbox" data-rs="${st.id}" ${sel.has(st.id) ? 'checked' : ''}> ${st.number}. ${esc(st.name)} — <b>${x.score}</b>/${n}${x.status !== 'graded' ? ' <span class="small" style="color:var(--wait)">채점 대기</span>' : ''}${x.attempt > 1 ? ` <span class="small muted">(${x.attempt}차)</span>` : ''}</label>`).join('')}</div>
      <div class="bar"><label><input type="checkbox" id="rsOpen" checked> 시험이 닫혀 있으면 함께 열기</label></div>
      <div class="bar"><span class="small muted">학생이 다시 풀면 성적표에 <b>2차</b>로 표시되고, 이전 점수도 함께 볼 수 있어요.</span><span style="flex:1"></span><button class="btn pri" id="rsGo" ${sel.size ? '' : 'disabled'}>🔁 ${sel.size}명 재출제</button></div>
    </div></div>`;
    $('#rsSet').onchange = () => { cid = +$('#rsSet').value; sel.clear(); draw(); };
    m.querySelectorAll('[data-rs]').forEach((x) => (x.onchange = () => { x.checked ? sel.add(+x.dataset.rs) : sel.delete(+x.dataset.rs); draw(); }));
    m.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = () => {
      sel.clear();
      if (b.dataset.pick === 'all') subs.forEach(({ st }) => sel.add(st.id));
      if (b.dataset.pick === 'low') subs.forEach(({ st, x }) => x.score < n * 0.8 && sel.add(st.id));
      draw();
    }));
    $('#x').onclick = () => (m.innerHTML = '');
    $('#bg').onclick = (e) => { if (e.target.id === 'bg') m.innerHTML = ''; };
    $('#rsGo').onclick = async () => {
      if (!confirm(`${c.title}\n${sel.size}명에게 다시 풀게 할까요? 지금 결과는 이전 기록으로 남아요.`)) return;
      const r = await T('/api/t/reissue', { concept: cid, student_ids: [...sel], open: $('#rsOpen').checked });
      if ($('#rsOpen').checked) await loadClosed();
      m.innerHTML = ''; toast(`${r.count}명 재출제했어요`); drawGrades();
    };
  };
  draw();
}

const clsOf = (v) => { const s = String(v ?? ''); const m = s.match(/(\d+)\s*반/) || s.match(/-\s*(\d+)/) || s.match(/(\d+)(?!.*\d)/); const n = m ? +m[1] : NaN; return n >= 1 && n <= 15 ? n : null; };
async function readFile() {
  const f = $('#file').files[0]; if (!f) return;
  if (!window.XLSX) { alert('엑셀 읽기 도구를 불러오는 중이에요. 잠시 뒤 다시 시도해 주세요.'); return; }
  const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', codepage: 949 });
  const def = +$('#defcls').value, defG = +$('#defgrade').value, out = {};
  const gradeOf = (v) => { const m = String(v ?? '').match(/(\d)\s*학년/); return m ? +m[1] : null; };
  let curG = defG;
  const put = (c, number, name, ids) => { if (!c || !number || !name) return; const k = curG + '-' + c; (out[k] = out[k] || new Map()).set(number, { name, ids }); };
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' }).map((r) => r.map((x) => String(x).trim()));
    const sheetCls = wb.SheetNames.length > 1 || /반/.test(sn) ? clsOf(sn) : null;
    curG = gradeOf(sn) || defG;
    const isHead = (r) => r.some((x) => /^(학생\s*)?(이름|성명)/.test(x));
    const heads = rows.map((r, i) => (isHead(r) ? i : -1)).filter((i) => i >= 0);
    let ci = -1, ni = -1, mi = -1, ii = -1, auto = 0, block = 0;
    const setCols = (hr) => {
      mi = hr.findIndex((x) => /^(학생\s*)?(이름|성명)/.test(x));
      ni = hr.findIndex((x) => /번호|번$|^no/i.test(x));
      ci = hr.findIndex((x, k) => k !== ni && /^반$|학반|반\s*\(|^class/i.test(x));
      ii = hr.findIndex((x) => /\bID\b|아이디/i.test(x) && !/AIEP|이메일|메일/i.test(x));
    };
    if (!heads.length) {
      const sample = rows.find((r) => r.filter(Boolean).length) || [];
      const nonEmpty = sample.filter(Boolean).length;
      if (nonEmpty >= 3) { ci = 0; ni = 1; mi = 2; } else if (nonEmpty === 2) { ni = 0; mi = 1; } else { mi = 0; }
    }
    // 반 열이 없고 머리글(성명/이름)이 여러 번 나오면 → 머리글마다 1반, 2반, … 순서로 나눔
    const blocks = heads.length > 1;
    let titleCls = null, blockCls = null;
    rows.forEach((r, i) => {
      // '<4학년 1반>' 같은 제목 줄이 있으면 그 반으로
      const cells = r.filter(Boolean);
      if (cells.length === 1 && /\d+\s*반/.test(cells[0]) && !isHead(r)) { titleCls = clsOf(cells[0]); curG = gradeOf(cells[0]) || curG; return; }
      if (isHead(r)) { setCols(r); block++; auto = 0; blockCls = titleCls || block; titleCls = null; return; }
      if (heads.length && i < heads[0]) return;
      const name = (r[mi] || '').replace(/\s+/g, ' ').trim(); if (!name) return;
      const number = ni >= 0 ? parseInt(r[ni], 10) : ++auto; if (!number) return;
      const c = ci >= 0 ? clsOf(r[ci]) : (sheetCls || (blocks || blockCls ? blockCls : def));
      const ids = ii >= 0 ? String(r[ii] || '').split(/[\s,;/]+/).map((x) => x.trim().toLowerCase()).filter(Boolean) : null;
      put(c, number, name, ids);
    });
  }
  const classes = Object.keys(out).sort((a, b) => a.split('-')[0] - b.split('-')[0] || a.split('-')[1] - b.split('-')[1]).map((k) => ({ grade: +k.split('-')[0], class_no: +k.split('-')[1], students: [...out[k]].sort((a, b) => a[0] - b[0]).map(([number, v]) => ({ number, name: v.name, login_ids: v.ids })) }));
  PREVIEW = classes;
  if (!classes.length) { $('#pv').innerHTML = '<div class="notice">학생을 찾지 못했어요. 첫 줄에 ‘반, 번호, 이름’ 머리글이 있는지 확인해 주세요.</div>'; return; }
  $('#pv').innerHTML = `<div class="notice ok">${classes.map((c) => `<b>${c.grade}학년 ${c.class_no}반 ${c.students.length}명</b>`).join(' · ')} 을(를) 찾았어요. 확인하고 저장하세요.</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start">${classes.map((c) => `<table class="plain"><tr><th colspan="3">${c.grade}학년 ${c.class_no}반</th></tr>${c.students.map((s) => `<tr><td>${s.number}</td><td>${esc(s.name)}</td><td class="small">${s.login_ids ? s.login_ids.map(esc).join('<br>') : '<span class="muted">ID 없음</span>'}</td></tr>`).join('')}</table>`).join('')}</div>
    ${classes.some((c) => c.students.some((s) => !s.login_ids || !s.login_ids.length)) ? '<div class="notice">⚠️ 학생 계정 ID가 없는 학생은 로그인할 수 없어요. 파일에 ‘학생 계정 ID’ 열을 넣거나, 저장한 뒤 아래 표에서 ID를 넣어 주세요.</div>' : ''}
    <label class="bar" style="cursor:pointer"><input type="checkbox" id="replaceR" checked> <span><b>반 전체 바꾸기</b> — 이 파일에 있는 반은, 파일에 없는 번호의 학생을 지워요 (그 학생이 낸 답도 지워짐). 번호가 바뀐 새 명렬표를 올릴 때 켜 두세요.</span></label>
    <div class="bar"><button class="btn pri" id="saveR">명렬표 저장</button></div>`;
  $('#saveR').onclick = async () => {
    const replace = $('#replaceR').checked;
    if (replace && !confirm('파일에 없는 번호의 학생은 지워져요. 계속할까요?')) return;
    const r = await T('/api/t/roster', { classes: PREVIEW, replace });
    toast(`${r.count}명 저장했어요 (ID 있는 학생 ${r.withIds}명${r.removed ? `, 지운 학생 ${r.removed}명` : ''})`); $('#pv').innerHTML = ''; $('#file').value = ''; CLS = PREVIEW[0].class_no; GRADE = PREVIEW[0].grade; localStorage.setItem('eng4-grade', GRADE); for (const c of PREVIEW) CLASS_COUNT[c.grade] = Math.max(CLASS_COUNT[c.grade] || 0, c.class_no); RSUB = 'list'; roster();
  };
}

// 링크 복사 (클립보드 → 안 되면 예비 방법)
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); return ok;
}

  app.querySelectorAll('[data-key]').forEach((b) => (b.onclick = () => { KEYSEL = +b.dataset.key; keyView(); scrollTo(0, 0); }));
}

TOKEN ? boot() : login();
</script>
</body></html>
