<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>교사용 · 2학기 영어 채점</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/xlsx.js" defer></script>
<script src="/qr.js"></script>
</head>
<body class="role-teacher">
<header class="top"><div class="wrap"><h1><span class="dag">†</span> 교사용 · 2학기 영어</h1>
  <nav class="tabs" id="nav" hidden aria-label="교사 메뉴"><button class="tab on" data-v="grades"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9z"/><path d="M9 11h6"/><path d="M9 15h4"/></svg> 채점·성적</button><button class="tab" data-v="review"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.3 2.3 4.7-5.1"/></svg> 검토·공개 <span class="badge" id="navWait" hidden></span></button><button class="tab" data-v="reports"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M8 17v-5"/><path d="M13 17V9"/><path d="M18 17v-8"/></svg> 분석</button><button class="tab" data-v="links"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.7"/></svg> 시험 열기·링크</button><button class="tab" data-v="key">문제·정답</button><button class="tab" data-v="roster">명렬표</button></nav>
  <span id="aijob" class="small" role="status" aria-live="polite"></span>
  <button id="themeBtn" class="btn sm ghost" hidden title="교사·학생 화면 테마 설정"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 1 10-10c0 2.2-1.8 3.5-3.5 3.5H16a2 2 0 0 0-2 2c0 1.4.8 2.5.8 3.2 0 .8-.7 1.3-2.8 1.3z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="11" cy="7.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/></svg> 테마</button>
  <button id="out" class="btn sm ghost" hidden>로그아웃</button></div></header>
<div class="wrap tight"><div id="sysmsg"><div id="sysSchema"></div><div id="sysErr" aria-live="polite"></div></div><p class="tabhelp small muted" id="tabhelp"></p></div>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<div id="printArea" class="result"></div>
<script src="/common.js"></script>
<script>
const app = $('#app');
const LS = 'eng4-teacher';
let GROUP = localStorage.getItem('eng4-grp') || 'concept', UNITF = localStorage.getItem('eng4-unitf') || 'all', RSUB = 'list', KEYSEL = null;
let GRADE = +(localStorage.getItem('eng4-grade') || 4), CLASS_COUNT = { 3: 7, 4: 6 };
let TOKEN = localStorage.getItem(LS), KEY = null, CLS = +(localStorage.getItem('eng4-cls') || 1), VIEW = 'grades', timer = null;
const T = (path, body) => api(path, body, TOKEN).catch((e) => { if (e.status === 401) { logout(); } throw e; });

function logout() { localStorage.removeItem(LS); TOKEN = null; RV.data = null; $('#nav').hidden = true; $('#out').hidden = true; $('#themeBtn').hidden = true; $('#tabhelp').textContent = ''; login(); }
$('#out').onclick = async () => { if (await leaveOK()) logout(); };
$('#nav').onclick = (e) => { const b = e.target.closest('[data-v]'); if (b) go(b.dataset.v); };

// ---------- 화면 테마 설정 (교사 본인 즉시 전환 + 학생 전 학년 공통 지정) ----------
const TEACHER_THEME_KEY = 'eng4-teacher-theme';
const THEME_META = [
  { id: 'default', name: '웜 페이퍼 (기본)', desc: '따뜻한 종이 톤', sw: ['#f4efe7', '#fbf8f3', '#e0522a'] },
  { id: 'dual', name: '듀얼 톤', desc: '학생 학습지 · 교사 슬레이트', sw: ['#f4f7fb', '#ffffff', '#2563eb'] },
  { id: 'playful', name: '초등 교실', desc: '코발트 · 3D 눌림 버튼', sw: ['#fffdf7', '#eff6ff', '#2563eb'] },
  { id: 'crisp', name: '고대비 집중', desc: '교실 프로젝터 · 뚜렷한 테두리', sw: ['#f3f4f6', '#ffffff', '#ea580c'] },
  { id: 'dark', name: '🌙 야간 다크', desc: '저녁 채점용 (교사 전용)', sw: ['#0f172a', '#1e293b', '#fb923c'], teacherOnly: true },
];
function applyTeacherTheme(id) {
  const t = THEME_META.some((x) => x.id === id) ? id : 'default';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(TEACHER_THEME_KEY, t); } catch {}
  return t;
}
applyTeacherTheme(localStorage.getItem(TEACHER_THEME_KEY) || 'default');
async function openThemeModal() {
  let stuTheme = 'default';
  try { stuTheme = (await api('/api/theme')).studentTheme || 'default'; } catch {}
  const curTeacher = document.documentElement.dataset.theme || 'default';
  const cards = (list, active, attr) => `<div class="theme-grid">${list.map((t) => `<button type="button" class="theme-card ${active === t.id ? 'on' : ''}" data-${attr}="${t.id}" aria-pressed="${active === t.id}"><span class="theme-swatches">${t.sw.map((c) => `<i style="background:${c}"></i>`).join('')}</span><b>${esc(t.name)}</b><span>${esc(t.desc)}</span></button>`).join('')}</div>`;
  const sh = openModal(`<div class="bar" style="margin-top:0"><b style="font-size:20px;flex:1">${ico('palette', 20)} 화면 테마 설정</b><button class="btn sm" id="thClose">닫기</button></div>
    <h3 style="margin:8px 0 4px;font-size:16px">내 화면 (교사) — 이 기기에서만 즉시 바뀌어요</h3>
    ${cards(THEME_META, curTeacher, 'ttheme')}
    <h3 style="margin:12px 0 4px;font-size:16px">학생 화면 — 모든 학생에게 공통 적용돼요</h3>
    <p class="small muted" style="margin:0 0 6px">학생은 직접 테마를 바꿀 수 없고, 선생님이 고른 테마가 자동으로 적용됩니다.</p>
    ${cards(THEME_META.filter((t) => !t.teacherOnly), stuTheme, 'stheme')}
    <div id="thStatus" class="small" style="min-height:22px"></div>`, { label: '화면 테마 설정' });
  const box = sh.box;
  box.querySelector('#thClose').onclick = () => sh.close();
  box.querySelectorAll('[data-ttheme]').forEach((b) => (b.onclick = () => {
    const v = applyTeacherTheme(b.dataset.ttheme);
    box.querySelectorAll('[data-ttheme]').forEach((x) => { const on = x.dataset.ttheme === v; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
    toast('교사 화면 테마를 바꿨어요', 'ok');
  }));
  box.querySelectorAll('[data-stheme]').forEach((b) => (b.onclick = async () => {
    const v = b.dataset.stheme;
    const stEl = box.querySelector('#thStatus');
    statusMsg(stEl, '학생 화면 테마 저장 중…', 'saving');
    try {
      await T('/api/t/theme', { studentTheme: v });
      box.querySelectorAll('[data-stheme]').forEach((x) => { const on = x.dataset.stheme === v; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
      statusMsg(stEl, '✓ 모든 학생 화면에 적용됐어요', 'saved');
      toast('학생 화면 테마를 바꿨어요', 'ok');
    } catch (e) {
      statusMsg(stEl, '⚠️ ' + e.message, 'error');
      toast(e.message, 'error');
    }
  }));
}
$('#themeBtn').onclick = openThemeModal;

function login(msg) {
  app.innerHTML = `<div class="center-screen"><h2>교사 로그인</h2><p class="lead">3·4학년 2학기 영어 채점</p>
  <form id="f" class="card"><label class="small muted">교사 비밀번호</label>
    <input type="password" id="pw" class="field" autofocus style="width:100%;font-size:19px;margin:4px 0 14px">
    ${msg ? `<div class="notice">${esc(msg)}</div>` : ''}
    <button class="btn pri" style="width:100%;margin-top:6px">들어가기</button></form></div>`;
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    try { TOKEN = (await api('/api/teacher/login', { password: $('#pw').value })).token; localStorage.setItem(LS, TOKEN); boot(); }
    catch (err) { login(err.message); }
  };
}
async function boot() {
  MEDIA_TOKEN = TOKEN;
  try { KEY = (await T('/api/t/key')).concepts;
    try { for (const v of Object.values((await T('/api/t/roster-check')).classes)) CLASS_COUNT[v.grade] = Math.max(CLASS_COUNT[v.grade] || 0, v.class_no); } catch {} } catch (e) { if (e.status !== 401) app.innerHTML = `<div class="notice">${esc(e.message)}</div>`; return; }
  await loadClosed();
  $('#nav').hidden = false; $('#out').hidden = false; $('#themeBtn').hidden = false; go('grades');
  // DB 업그레이드 확인 (안 됐으면 저장 기능이 멈추므로 위에 계속 알림)
  T('/api/t/schema').then((r) => { $('#sysSchema').innerHTML = r.ok ? '' : `<div class="notice" role="alert">⚠️ ${esc(r.message)}</div>`; }).catch(() => {});
  checkErrors(); setInterval(() => { if (TOKEN && !document.hidden) checkErrors(); }, 5 * 60000);
}
// ---------------- ⚠️ 서버·화면 오류 알림 (최근 24시간, '확인함' 이후 새로 생긴 것만) ----------------
const ERR_SEEN_KEY = 'eng4-err-seen';
const errSeen = () => { try { return +(localStorage.getItem(ERR_SEEN_KEY) || 0); } catch { return 0; } };
let ERRS = null;
async function checkErrors() {
  try { ERRS = await T('/api/t/errors?hours=24'); } catch { return; }
  const el = $('#sysErr'); if (!el) return;
  if (ERRS.missing) { el.innerHTML = ''; return; }
  const fresh = ERRS.items.filter((x) => x.id > errSeen());
  if (!fresh.length) { el.innerHTML = ''; return; }
  const last = fresh[0], src = { server: '서버', teacher: '교사 화면', student: '학생 화면' };
  el.innerHTML = `<div class="notice" role="alert">⚠️ 최근 24시간에 새 오류 <b>${fresh.length}${fresh.length >= 50 ? '+' : ''}건</b> — 마지막: ${new Date(last.at).toLocaleString('ko-KR')} · ${src[last.source] || last.source} · ${esc(last.path || '')} ${esc((last.message || '').slice(0, 80))}
    <button class="btn sm" id="errMore">자세히</button> <button class="btn sm ghost" id="errOk">확인함</button></div>`;
  $('#errOk').onclick = () => { try { localStorage.setItem(ERR_SEEN_KEY, String(ERRS.items[0].id)); } catch {} el.innerHTML = ''; };
  $('#errMore').onclick = () => openErrors();
}
function openErrors() {
  const sh = shell('최근 오류'), src = { server: '서버', teacher: '교사 화면', student: '학생 화면' }, seen = errSeen();
  sh.m.innerHTML = `<div class="modal"><div class="box">
    <div class="bar" style="margin-top:0"><b style="font-size:20px;flex:1">⚠️ 최근 24시간 오류 (${ERRS.count}건${ERRS.count > 50 ? ', 최근 50건만' : ''})</b><button class="btn sm" id="x">닫기</button></div>
    <p class="small muted">같은 오류는 1분에 한 번만 기록돼요. 30일 지난 기록은 자동으로 지워져요. ${ERRS.telegram ? '📨 텔레그램 알림 켜짐' : '텔레그램 알림은 꺼져 있어요 (Cloudflare 비밀값 TELEGRAM_BOT_TOKEN·TELEGRAM_CHAT_ID를 넣으면 켜짐)'}</p>
    <table class="plain small"><tr><th>시각</th><th>어디</th><th>주소</th><th>상태</th><th>내용</th></tr>${ERRS.items.map((x) => `<tr class="${x.id > seen ? '' : 'muted'}"><td style="white-space:nowrap">${new Date(x.at).toLocaleString('ko-KR')}</td><td>${src[x.source] || esc(x.source)}</td><td>${esc(x.method || '')} ${esc(x.path || '')}</td><td>${x.status ?? ''}</td><td>${esc(x.message || '')}</td></tr>`).join('')}</table>
  </div></div>`;
  $('#x').onclick = () => sh.close();
}
// ---------------- 떠나기 전 확인: 저장 안 된 검토 변경 · 열린 상세 창 · AI 일괄 작업 ----------------
let MODAL_DIRTY = null;   // 열린 상세 창이 고친 게 있는지 알려 주는 함수
async function leaveOK() {
  if (MODAL_DIRTY && MODAL_DIRTY() && !confirm('채점 창에 저장하지 않은 변경이 있어요. 버리고 이동할까요?')) return false;
  if (RV.data) {
    await rvFlushAll(RV.data);
    const n = rvUnsaved(RV.data).length;
    if (n && !confirm(`검토·공개에 저장되지 않은 변경이 ${n}건 있어요 (저장 실패).\n이동하면 이 변경은 사라져요. 그래도 이동할까요?`)) return false;
  }
  return true;
}
addEventListener('beforeunload', (e) => {
  if ((RV.data && rvUnsaved(RV.data).length) || AIJOB.running || (MODAL_DIRTY && MODAL_DIRTY())) { e.preventDefault(); e.returnValue = ''; }
});
// 창(모달) 틀: 초점 가두기·Esc·배경 클릭 (common.js trapModal). canClose가 false면 안 닫힘
function shell(label, canClose, onClosed) {
  const m = $('#modal'); if (m._sh) m._sh.close();
  const t = trapModal(m, { label, canClose, onClose: () => sh.close() });
  const sh = { m, tryClose: () => t.tryClose(), close() { if (m._sh !== sh) return; m._sh = null; t.release(); m.innerHTML = ''; MODAL_DIRTY = null; if (onClosed) onClosed(); } };
  m._sh = sh; return sh;
}
// ---------------- 🤖 AI 일괄 작업: 메뉴를 옮겨도 계속, 한 번에 하나, 중지·이어서·실패만 다시 ----------------
const AIJOB = { running: false, stop: false, queue: [], total: 0, done: 0, ok: 0, failed: [], note: '' };
async function runAI(ids) {
  if (AIJOB.running) return toast('이미 AI 채점 중이에요', 'error');
  Object.assign(AIJOB, { running: true, stop: false, queue: [...new Set(ids)], total: new Set(ids).size, done: 0, ok: 0, failed: [], note: '' });
  aiRender();
  while (AIJOB.queue.length && !AIJOB.stop) {
    const id = AIJOB.queue[0];
    try { await T('/api/t/ai-grade', { id }); AIJOB.ok++; }
    catch (e) { AIJOB.failed.push({ id, msg: e.message }); if (e.status === 503 || e.status === 401) { AIJOB.stop = true; AIJOB.note = e.message; } }
    AIJOB.queue.shift(); AIJOB.done++; aiRender();
  }
  AIJOB.running = false; aiRender();
  toast(`🤖 AI 제안 ${AIJOB.ok}건 완료${AIJOB.failed.length ? ` · 실패 ${AIJOB.failed.length}건` : ''}${AIJOB.queue.length ? ` · 남은 ${AIJOB.queue.length}건 (중지됨)` : ''}`, AIJOB.failed.length ? 'error' : 'ok');
  if (VIEW === 'grades' && !$('#modal').innerHTML) drawGrades(true);
}
function aiRender() {
  const el = $('#aijob'); if (!el) return;
  const j = AIJOB;
  if (j.running) el.innerHTML = `🤖 AI 제안 ${j.done}/${j.total}${j.failed.length ? ` · 실패 ${j.failed.length}` : ''} <button class="btn sm ghost" id="aiStop" ${j.stop ? 'disabled' : ''}>${j.stop ? '멈추는 중…' : '⏸ 중지'}</button>`;
  else if (j.queue.length || j.failed.length) el.innerHTML = `🤖 ${j.note ? esc(j.note) + ' · ' : ''}${j.queue.length ? `남은 ${j.queue.length}건 <button class="btn sm" id="aiResume">▶ 이어서</button>` : ''}${j.failed.length ? ` 실패 ${j.failed.length}건 <button class="btn sm" id="aiRetry" title="${esc(j.failed.slice(0, 5).map((f) => f.msg).join('\n'))}">↻ 실패만 다시</button>` : ''} <button class="btn sm ghost" id="aiClear" aria-label="AI 작업 알림 닫기">✕</button>`;
  else el.innerHTML = '';
  if ($('#aiStop')) $('#aiStop').onclick = () => { j.stop = true; aiRender(); };
  if ($('#aiResume')) $('#aiResume').onclick = () => runAI(j.queue);
  if ($('#aiRetry')) $('#aiRetry').onclick = () => runAI(j.failed.map((f) => f.id));
  if ($('#aiClear')) $('#aiClear').onclick = () => { j.queue = []; j.failed = []; j.note = ''; aiRender(); };
  const b = $('#aiAll'); if (b) b.disabled = j.running || b.dataset.off === '1';
}
// ---------------- 📋 오늘 할 일 (학년 전체 반) ----------------
let TODAY = null;
async function loadToday() {
  try { TODAY = (await T('/api/t/today?grade=' + GRADE)).classes; } catch { TODAY = null; }
  const w = TODAY ? TODAY.reduce((a, c) => a + c.wait, 0) : 0;
  const nb = $('#navWait'); if (nb) { nb.hidden = !w; nb.textContent = w; nb.title = `채점 대기 ${w}건`; }
  return TODAY;
}
function todayHTML(onlyCls) {
  if (!TODAY) return '';
  const rows = onlyCls ? TODAY.filter((c) => c.class_no === onlyCls) : TODAY;
  if (!rows.length) return '';
  const sum = (k) => rows.reduce((a, c) => a + c[k], 0);
  const tile = (k, iconName, label, act, hint) => `<div class="tile ${sum(k) ? 'warn' : 'done'}"><b>${sum(k)}</b><span>${ico(iconName, 15)} ${label}</span>${sum(k) && act ? `<button class="btn sm" data-tgo="${act}:${onlyCls || 0}">${hint}</button>` : '<span class="small muted">없음</span>'}</div>`;
  if (onlyCls) return `<div class="today compact" role="region" aria-label="오늘 할 일"><b>${ico('board', 16)} 오늘 할 일 · ${GRADE}학년 ${onlyCls}반</b>
    ${tile('wait', 'clock', '채점 대기', 'wait', '검토·공개에서 처리 →')}${tile('aiSuggest', 'sparkle', 'AI 제안 미검토', 'wait', '검토하기 →')}${tile('unpub', 'chat', '피드백 미공개', 'unpub', '공개하기 →')}
    <div class="tile ${sum('missing') ? 'warn' : 'done'}"><b>${sum('missing')}</b><span>${ico('inbox', 15)} 미제출 칸</span><span class="small muted">열린 시험 ${rows[0].openSets}개 기준 · 아래 표의 · 칸</span></div></div>`;
  return `<section class="today" role="region" aria-label="오늘 할 일"><h3 style="margin:0 0 8px">${ico('board', 18)} 오늘 할 일 · ${GRADE}학년 전체</h3>
    <div class="today-tiles">${tile('wait', 'clock', '채점 대기', 'wait', '지금 보기')}${tile('aiSuggest', 'sparkle', 'AI 제안 미검토', 'wait', '지금 보기')}${tile('unpub', 'chat', '피드백 미공개', 'unpub', '지금 보기')}<div class="tile ${sum('missing') ? 'warn' : 'done'}"><b>${sum('missing')}</b><span>${ico('inbox', 15)} 미제출 칸</span><span class="small muted">열린 시험 기준</span></div></div>
    <table class="plain small"><tr><th>반</th><th>채점 대기</th><th>AI 제안</th><th>피드백 미공개</th><th>미제출 칸</th></tr>${rows.map((c) => `<tr><td><b>${c.class_no}반</b> <span class="muted">${c.students}명</span></td>
      <td>${c.wait ? `<button class="linkbtn" data-tgo="wait:${c.class_no}">${c.wait}건</button>` : '0'}</td><td>${c.aiSuggest || 0}</td>
      <td>${c.unpub ? `<button class="linkbtn" data-tgo="unpub:${c.class_no}">${c.unpub}건</button>` : '0'}</td>
      <td>${c.missing ? `<button class="linkbtn" data-tgo="miss:${c.class_no}" title="성적표에서 보기">${c.missing}칸</button>` : '0'}</td></tr>`).join('')}</table></section>`;
}
function bindToday(root) {
  root.querySelectorAll('[data-tgo]').forEach((b) => (b.onclick = async () => {
    const [k, c] = b.dataset.tgo.split(':'), cls = +c;
    if (k === 'miss') { CLS = cls; localStorage.setItem('eng4-cls', CLS); return go('grades'); }

  const units = [...new Map(KG().filter((c) => c.kind !== 'concept').map((c) => [c.ukey, c.unit])).entries()];

  const aiTodo = d.submissions.filter((s) => s.aiNeed > 0 && ids.includes(s.concept));
  const aiItems = aiTodo.reduce((a, s) => a + s.aiNeed, 0);
  const avg = ids.map((cid) => { const xs = d.students.map((s) => by[s.id + ':' + cid]).filter(Boolean); return xs.length ? (xs.reduce((a, b) => a + b.score, 0) / xs.length).toFixed(1) : '-'; });

      : hby[s.id + ':' + ids[k]] ? `<td class="muted" title="이전: ${histTip(s.id, ids[k])}">🔁</td>` : `<td class="muted">·</td>`).join('')}<td>${got.length}</td><td>${got.length ? Math.round(got.reduce((a, b) => a + b.score / totalOf(b.concept), 0) / got.length * 100) + '%' : '-'}</td></tr>`;
  }).join('')}
  <tr class="avg"><td></td><td class="nm">반 평균</td>${avg.map((a) => `<td>${a}</td>`).join('')}<td></td><td></td></tr>
  <tr class="avg"><td></td><td class="nm">제출 인원</td>${cnt.map((a) => `<td>${a}</td>`).join('')}<td></td><td></td></tr></tbody></table></div>
  <details class="help"><summary>ⓘ 표 보는 법</summary><p class="small">칸을 누르면 학생 답을 보고 O/X를 고칠 수 있어요. <span class="badge wait">노랑</span> 채점 대기(숫자 뒤 ?) · <span class="badge ok">초록</span> 확정 80% 이상 · <span class="badge no">빨강</span> 확정 80% 미만 · 🤖 AI 제안 있음(확정 전) · 💬 피드백 초안(학생에게 안 보임) · 📣 피드백 공개됨 · <b>2차</b> 재출제 후 다시 푼 결과(칸에 마우스를 올리면 이전 점수) · 🔁 재출제되어 아직 다시 안 푼 학생. 학생은 선생님이 확정한 뒤에 결과를 볼 수 있어요. 🔤 단어 시험 · ✍️ 철자 시험 · 📝 단원평가</p></details>`;

function downloadCSV(d, by) {
  const ids = KG().map((c) => c.id), totalOf = (cid) => KEY.find((c) => c.id === cid).questions.length;
  const rows = [['학년', '반', '번호', '이름', ...KG().map((c) => `${c.short}(${c.questions.length})`), '제출 수', '정답률(%)']];
  d.students.forEach((s) => {
    const sc = ids.map((cid) => { const x = by[s.id + ':' + cid]; return x ? x.score + (x.status !== 'graded' ? '(대기)' : '') : ''; });
    const got = ids.map((cid) => by[s.id + ':' + cid]).filter(Boolean);
    rows.push([GRADE, CLS, s.number, s.name, ...sc, got.length, got.length ? Math.round(got.reduce((a, b) => a + b.score / totalOf(b.concept), 0) / got.length * 100) : '']);
  });
  const csv = '﻿' + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${GRADE}학년${CLS}반_영어_성적.csv`; a.click();
}

// 한 학생 답 자세히: O/X·학생에게 남길 말. 저장 방식은 검토·공개와 같음(누른 O/X는 선생님 값으로 기록, rev로 충돌 감지)
// 버튼: 채점 대기면 [확정] [저장(대기 유지)] [AI 제안] / 확정됐으면 [수정 저장(확정 유지)] [↩ 확정 취소]

        · AI: ${s.ai ? '🤖 제안 있음' : '없음'} · 피드백: ${s.feedback ? (graded ? '📣 공개됨' : '저장됨 (확정하면 공개)') : s.feedback_draft ? '💬 초안만 (미공개)' : '없음'}

      <div class="gr h"><div>#</div><div>문제</div><div>학생 답</div><div>정답</div><div>채점</div></div>

      <label class="small muted" for="fbk">학생에게 남길 말 (선택${graded ? ' · 저장하면 학생 화면에 바로 보여요' : ' · 확정하면 보여요'})</label><textarea id="fbk" placeholder="예: 요일 첫 글자는 대문자로 써요!">${esc(fb)}</textarea>
      <div class="bar">${graded
        ? `<button class="btn pri" id="save">수정 저장 (확정 유지 · 학생에게 바로 반영)</button><button class="btn" id="undo" title="학생 화면에서 결과를 다시 숨겨요">↩ 확정 취소 (채점 대기로)</button><button class="btn" id="aiOne" disabled title="확정된 결과는 AI 제안을 받지 않아요. 확정 취소 후 사용하세요">🤖 AI 제안</button>`
        : `<button class="btn pri" id="ok">✔ 채점 확정 (학생에게 결과 공개)</button><button class="btn" id="save">저장 (채점 대기 유지)</button><button class="btn" id="aiOne" ${AIJOB.running ? 'disabled title="AI 일괄 작업 중"' : ''}>🤖 AI 제안</button>`}
        <span style="flex:1"></span><button class="btn" id="redo">🔁 다시 풀게 하기 (기록 남김)</button><button class="btn sm danger" id="reset" title="기록 없이 이 답을 완전히 지워요">완전 삭제</button></div>
    </div></div>`;
    m.querySelectorAll('.ox button').forEach((b) => (b.onclick = () => { const i = +b.dataset.i; marks[i] = b.dataset.v === '1'; touched.add(i); draw(); }));
    $('#fbk').oninput = () => { const el = $('#subSave'); if (el) statusMsg(el, dirty() ? '✎ 저장 안 한 변경 있음' : '✓ 저장된 상태', dirty() ? 'saving' : 'saved'); };
    $('#x').onclick = () => sh.tryClose();
    if ($('#useDraft')) $('#useDraft').onclick = () => { $('#fbk').value = s.feedback_draft; $('#fbk').oninput(); $('#fbk').focus(); };
    if ($('#ok')) $('#ok').onclick = () => save('graded');
    $('#save').onclick = () => save(undefined);
    if ($('#undo')) $('#undo').onclick = () => { if (confirm('확정을 취소할까요? 학생 화면에서 결과가 다시 숨겨져요.' + (dirty() ? '\n지금 고친 O/X·말도 함께 저장돼요.' : ''))) save('submitted'); };
    $('#aiOne').onclick = ai;
    $('#redo').onclick = async () => { if (!confirm('이 답은 이전 기록으로 남기고, 같은 시험을 다시 풀게 할까요?')) return; try { await T('/api/t/reissue', { id, open: true }); await loadClosed(); toast('재출제했어요 (이전 기록 보관)', 'ok'); changed = true; touched.clear(); sh.close(); } catch (e) { toast(e.message, 'error'); } };
    $('#reset').onclick = async () => { if (!confirm('기록을 남기지 않고 이 답을 완전히 지울까요? 되돌릴 수 없어요.')) return; try { await T('/api/t/reset', { id }); toast('삭제했어요'); changed = true; touched.clear(); sh.close(); } catch (e) { toast(e.message, 'error'); } };
  };
  // status: 'graded'(확정) | 'submitted'(확정 취소) | undefined(상태 그대로)
  const save = async (status, keepOpen) => {
    if (busy) return false; busy = true;
    const fb = fbNow(), overrides = overridesNow();
    const el = $('#subSave'); if (el) statusMsg(el, '저장 중…', 'saving');
    m.querySelectorAll('.bar .btn').forEach((b) => (b.disabled = true));
    try {
      const r = await T('/api/t/grade', { id, rev: s.rev, overrides, feedback: fb, status });
      Object.assign(s, { rev: r.rev, status: r.status, overrides, feedback: fb.slice(0, 500) || null });
      touched.clear(); marks = srvMarks(); changed = true;
      if (RV.data) { const x = RV.data.find((y) => y.id === id); if (x) { Object.assign(x, { rev: r.rev, status: r.status, overrides: { ...overrides }, feedback: s.feedback, _srv: { ...x._srv, overrides: { ...overrides } } }); x.marks = rvMarksOf(x); } }
      busy = false;
      if (keepOpen) { draw('✓ 저장했어요'); return true; }
      toast(status === 'graded' ? '확정했어요' : status === 'submitted' ? '확정을 취소했어요 (채점 대기)' : '저장했어요', 'ok'); sh.close(); return true;
    } catch (e) {
      busy = false;
      draw(); const el2 = $('#subSave'); if (el2) statusMsg(el2, '⚠️ 저장 실패: ' + e.message + (e.status === 409 ? ' — 닫고 다시 열어 주세요' : ''), 'error');
      return false;
    }
  };
  // AI 제안: 저장 안 한 O/X가 있으면 먼저 저장 (AI가 선생님 값을 덮어쓰지 않게)
  const ai = async () => {
    if (dirty()) { if (!confirm('저장하지 않은 O/X·말이 있어요. 먼저 저장(채점 대기 유지)한 뒤 AI 제안을 받을까요?')) return; if (!(await save(undefined, true))) return; }
    if (busy) return; busy = true;
    $('#aiOne').disabled = true; $('#aiOne').textContent = '🤖 확인 중…';
    try {
      const r = await T('/api/t/ai-grade', { id, rev: s.rev });
      Object.assign(s, { ai: r.ai, overrides: r.overrides, rev: r.rev }); marks = srvMarks(); changed = true; busy = false;
      draw(r.asked ? `🤖 AI가 ${r.asked}문항을 봤어요 — 확인 후 확정하세요` : '🤖 AI에게 보낼 애매한 오답이 없어요');
    } catch (e) { busy = false; draw(); statusMsg($('#subSave'), '⚠️ AI 실패: ' + e.message, 'error'); }
  };
  draw();
}

// ---------------- 일괄 확정 / 확정 취소 ----------------
function openConfirm(visibleIds) {
  const sh = shell('일괄 확정'), m = sh.m, sets = KG();
  const st = { scope: 'class', undo: false, filter: 'all', sel: new Set(visibleIds), counts: null, useDraft: true };
  const kindName = { concept: '', word: '🔤 단어 시험', spelltest: '✍️ 철자 시험', exam: '📝 단원평가' };
  const body = (extra) => ({ grade: GRADE, class: st.scope === 'class' ? CLS : null, concepts: [...st.sel], filter: st.filter, undo: st.undo, useDraft: st.useDraft, ...extra });
  // 시험별 대상 수(전체 시험 기준)를 먼저 세어 둠
  const loadCounts = async () => {
    let r; try { r = await T('/api/t/confirm-all', { grade: GRADE, class: st.scope === 'class' ? CLS : null, filter: st.filter, undo: st.undo, dry: true }); } catch (e) { toast(e.message, 'error'); st.counts = {}; draw(); return; }
    if (m._sh !== sh) return;
    st.counts = r.byConcept;
    // 처음엔 '보이는 시험 중 대상이 있는 것'만 골라 둠
    if (!st.touched) st.sel = new Set(visibleIds.filter((id) => st.counts[id]));
    draw();
  };
  const draw = () => {
    const cnt = (id) => (st.counts ? st.counts[id] || 0 : 0);
    const total = [...st.sel].reduce((a, id) => a + cnt(id), 0);
    const groups = []; for (const c of sets) { const g = c.kind === 'concept' ? '📘 기본 개념' : `📝 ${c.unit}`; const last = groups[groups.length - 1]; if (last && last[0] === g) last[1].push(c); else groups.push([g, [c]]); }
    m.innerHTML = `<div class="modal"><div class="box">
      <div class="bar" style="margin-top:0"><b style="font-size:20px;flex:1">${st.undo ? '↩ 확정 취소' : '✔ 일괄 확정'}</b><button class="btn sm" id="x">닫기</button></div>
      <div class="tabs seg" style="margin-bottom:10px"><button class="tab ${!st.undo ? 'on' : ''}" data-undo="0">✔ 확정하기</button><button class="tab ${st.undo ? 'on' : ''}" data-undo="1">↩ 확정 취소</button></div>
      <p class="small muted">${st.undo ? '확정된 결과를 다시 <b>채점 대기</b>로 돌려요. 학생 화면에서 결과가 다시 숨겨져요. (점수·O/X 수정 내용은 그대로)' : '채점 대기 중인 결과를 <b>지금 보이는 점수 그대로</b> 확정해요. 확정하면 학생이 결과를 볼 수 있어요.'}</p>
      <div class="bar"><b>범위</b>
        <div class="tabs seg"><button class="tab ${st.scope === 'class' ? 'on' : ''}" data-scope="class">${GRADE}학년 ${CLS}반</button><button class="tab ${st.scope === 'grade' ? 'on' : ''}" data-scope="grade">${GRADE}학년 전체 반</button></div>
        ${st.undo ? '' : `<b style="margin-left:10px">조건</b><select id="cfFilter" class="field">
          <option value="all" ${st.filter === 'all' ? 'selected' : ''}>대기 중인 것 모두</option>
          <option value="perfect" ${st.filter === 'perfect' ? 'selected' : ''}>만점인 것만</option>
          <option value="ai" ${st.filter === 'ai' ? 'selected' : ''}>🤖 AI 채점을 마친 것(+만점)만</option></select>`}</div>
      <div class="bar" style="margin:4px 0 6px"><b style="flex:1">시험 (${st.sel.size})</b><button class="btn sm" id="cfAll">대상 있는 것 전체</button><button class="btn sm ghost" id="cfNone">선택 해제</button></div>
      <div class="pplist">${st.counts == null ? '<p class="muted">세는 중…</p>' : groups.map(([g, cs]) => `<div class="sg">${g}</div>${cs.map((c) => { const n = cnt(c.id); return `<label class="${n ? '' : 'muted'}"><input type="checkbox" data-cf="${c.id}" ${st.sel.has(c.id) ? 'checked' : ''} ${n ? '' : 'disabled'}> ${c.kind === 'concept' ? `${c.id}. ${esc(c.title)}` : kindName[c.kind]} <b>${n ? `${n}건` : ''}</b>${visibleIds.includes(c.id) ? ' <span class="small muted">· 지금 화면</span>' : ''}</label>`; }).join('')}`).join('')}</div>
      ${st.undo ? '' : `<label class="small" style="display:block;margin:6px 0"><input type="checkbox" id="cfDraft" ${st.useDraft ? 'checked' : ''}> 💬 AI 피드백 초안도 함께 학생에게 공개 (선생님이 쓴 말이 없는 것만)</label>`}
      <div class="bar"><span class="small">${st.undo ? '확정 취소' : '확정'}할 결과 <b style="font-size:18px">${total}건</b></span><span style="flex:1"></span>
        <button class="btn ${st.undo ? 'danger' : 'pri'}" id="cfGo" ${total ? '' : 'disabled'}>${st.undo ? `↩ ${total}건 확정 취소` : `✔ ${total}건 확정`}</button></div>
    </div></div>`;
    m.querySelectorAll('[data-undo]').forEach((b) => (b.onclick = () => { st.undo = b.dataset.undo === '1'; st.touched = false; st.counts = null; draw(); loadCounts(); }));
    m.querySelectorAll('[data-scope]').forEach((b) => (b.onclick = () => { st.scope = b.dataset.scope; st.counts = null; draw(); loadCounts(); }));
    if ($('#cfFilter')) $('#cfFilter').onchange = () => { st.filter = $('#cfFilter').value; st.counts = null; draw(); loadCounts(); };
    m.querySelectorAll('[data-cf]').forEach((x) => (x.onchange = () => { st.touched = true; x.checked ? st.sel.add(+x.dataset.cf) : st.sel.delete(+x.dataset.cf); draw(); }));
    if ($('#cfDraft')) $('#cfDraft').onchange = () => (st.useDraft = $('#cfDraft').checked);
    $('#cfAll').onclick = () => { st.touched = true; sets.forEach((c) => cnt(c.id) && st.sel.add(c.id)); draw(); };
    $('#cfNone').onclick = () => { st.touched = true; st.sel.clear(); draw(); };
    $('#x').onclick = () => sh.close();
    $('#cfGo').onclick = async () => {
      const where = st.scope === 'class' ? `${GRADE}학년 ${CLS}반` : `${GRADE}학년 전체 반`;
      if (!confirm(st.undo ? `${where}의 확정된 결과 ${total}건을 채점 대기로 되돌릴까요?\n학생 화면에서 결과가 다시 숨겨져요.` : `${where}의 결과 ${total}건을 확정할까요?\n확정하면 학생이 결과를 볼 수 있어요.`)) return;
      $('#cfGo').disabled = true;
      // 서버가 한 번에 일부만 처리하고 more(남은 수)를 알려 주면 남은 것이 없을 때까지 이어서 부름
      const r = { count: 0, drafts: 0, conflicts: 0 };
      try {
        for (let k = 0; k < 100; k++) {
          $('#cfGo').textContent = `처리 중… ${r.count}건`;
          const d = await T('/api/t/confirm-all', body());
          r.count += d.count || 0; r.drafts += d.drafts || 0; r.conflicts += d.conflicts || 0;
          if (!d.more || !(d.count || d.conflicts)) break;
        }
      } catch (e) { toast(r.count ? `${r.count}건까지 처리했어요. ${e.message}` : e.message, 'error'); sh.close(); drawGrades(); return; }
      sh.close(); toast(st.undo ? `${r.count}건 확정 취소했어요` : `${r.count}건 확정했어요${r.drafts ? ` · 피드백 ${r.drafts}건 공개` : ''}${r.conflicts ? ` · ${r.conflicts}건은 다른 곳에서 바뀌어 건너뜀` : ''}`, r.conflicts ? 'error' : 'ok'); drawGrades();
    };
  };
  draw(); loadCounts();
}

// ---------------- 재출제 ----------------
function openReissue(visibleIds, d, by) {
  const sets = KG().filter((c) => d.students.some((st) => by[st.id + ':' + c.id]));
  if (!sets.length) return alert('이 반에서 제출된 시험이 아직 없어요.');
  const sh = shell('재출제'), m = sh.m, totalOf = (cid) => KEY.find((c) => c.id === cid).questions.length;
  let cid = (sets.find((c) => visibleIds.includes(c.id)) || sets[0]).id;
  const sel = new Set();
  const draw = () => {
    const c = KEY.find((x) => x.id === cid), n = totalOf(cid);
    const subs = d.students.map((st) => ({ st, x: by[st.id + ':' + cid] })).filter((r) => r.x);
    m.innerHTML = `<div class="modal"><div class="box">
      <div class="bar" style="margin-top:0"><b style="font-size:20px;flex:1">🔁 ${GRADE}학년 ${CLS}반 재출제</b><button class="btn sm" id="x">닫기</button></div>
      <p class="small muted">고른 학생의 지금 답과 점수는 <b>이전 기록(1차, 2차…)</b>으로 남기고, 같은 시험을 처음부터 다시 풀게 해요.</p>
      <label class="small muted">시험</label>
      <select id="rsSet" class="field" style="width:100%;margin:4px 0 12px">${sets.map((x) => `<option value="${x.id}" ${x.id === cid ? 'selected' : ''}>${esc(qLabel(x))} · ${esc(x.title)} (${d.students.filter((st) => by[st.id + ':' + x.id]).length}명 제출)</option>`).join('')}</select>
      <div class="bar" style="margin:0 0 6px"><b style="flex:1">학생 (${sel.size}/${subs.length})</b>
        <button class="btn sm" data-pick="all">제출한 학생 전체</button><button class="btn sm" data-pick="low">80% 미만만</button><button class="btn sm ghost" data-pick="none">선택 해제</button></div>
      <div class="pplist">${subs.map(({ st, x }) => `<label><input type="checkbox" data-rs="${st.id}" ${sel.has(st.id) ? 'checked' : ''}> ${st.number}. ${esc(st.name)} — <b>${x.score}</b>/${n}${x.status !== 'graded' ? ' <span class="small" style="color:var(--wait)">채점 대기</span>' : ''}${x.attempt > 1 ? ` <span class="small muted">(${x.attempt}차)</span>` : ''}</label>`).join('')}</div>
      <div class="bar"><label><input type="checkbox" id="rsOpen" checked> 시험이 닫혀 있으면 함께 열기</label></div>
      <div class="bar"><span class="small muted">학생이 다시 풀면 성적표에 <b>2차</b>로 표시되고, 이전 점수도 함께 볼 수 있어요.</span><span style="flex:1"></span><button class="btn pri" id="rsGo" ${sel.size ? '' : 'disabled'}>🔁 ${sel.size}명 재출제</button></div>
    </div></div>`;
    $('#rsSet').onchange = () => { cid = +$('#rsSet').value; sel.clear(); draw(); };
    m.querySelectorAll('[data-rs]').forEach((x) => (x.onchange = () => { x.checked ? sel.add(+x.dataset.rs) : sel.delete(+x.dataset.rs); draw(); }));
    m.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = () => {
      sel.clear();
      if (b.dataset.pick === 'all') subs.forEach(({ st }) => sel.add(st.id));
      if (b.dataset.pick === 'low') subs.forEach(({ st, x }) => x.score < n * 0.8 && sel.add(st.id));
      draw();
    }));
    $('#x').onclick = () => sh.close();
    $('#rsGo').onclick = async () => {
      if (!confirm(`${c.title}\n${sel.size}명에게 다시 풀게 할까요? 지금 결과는 이전 기록으로 남아요.`)) return;
      const open = $('#rsOpen').checked; $('#rsGo').disabled = true;
      let r; try { r = await T('/api/t/reissue', { concept: cid, student_ids: [...sel], open }); } catch (e) { toast(e.message, 'error'); $('#rsGo').disabled = false; return; }
      if (open) await loadClosed();
      sh.close(); toast(`${r.count}명 재출제했어요 (이전 기록 보관)`, 'ok'); drawGrades();
    };
  };
  draw();
}

  const def = +$('#defcls').value, defG = +$('#defgrade').value, out = {};
  const gradeOf = (v) => { const m = String(v ?? '').match(/(\d)\s*학년/); return m ? +m[1] : null; };
  let curG = defG;
  const put = (c, number, name, ids) => { if (!c || !number || !name) return; const k = curG + '-' + c; (out[k] = out[k] || new Map()).set(number, { name, ids }); };
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' }).map((r) => r.map((x) => String(x).trim()));
    const sheetCls = wb.SheetNames.length > 1 || /반/.test(sn) ? clsOf(sn) : null;
    curG = gradeOf(sn) || defG;
    const isHead = (r) => r.some((x) => /^(학생\s*)?(이름|성명)/.test(x));
    const heads = rows.map((r, i) => (isHead(r) ? i : -1)).filter((i) => i >= 0);

    const setCols = (hr) => {
      mi = hr.findIndex((x) => /^(학생\s*)?(이름|성명)/.test(x));
      ni = hr.findIndex((x) => /번호|번$|^no/i.test(x));
      ci = hr.findIndex((x, k) => k !== ni && /^반$|학반|반\s*\(|^class/i.test(x));
      ii = hr.findIndex((x) => /\bID\b|아이디/i.test(x) && !/AIEP|이메일|메일/i.test(x));
    };
    if (!heads.length) {
      const sample = rows.find((r) => r.filter(Boolean).length) || [];
      const nonEmpty = sample.filter(Boolean).length;
      if (nonEmpty >= 3) { ci = 0; ni = 1; mi = 2; } else if (nonEmpty === 2) { ni = 0; mi = 1; } else { mi = 0; }
    }
    // 반 열이 없고 머리글(성명/이름)이 여러 번 나오면 → 머리글마다 1반, 2반, … 순서로 나눔
    const blocks = heads.length > 1;
    let titleCls = null, blockCls = null;

      const cells = r.filter(Boolean);

    if (!PV) return;

    if (!confirm(`명렬표를 저장할까요?\n- 추가 ${t('add')}명 · 이름·ID 바뀜 ${t('update')}명 · 보관 해제 ${t('restore')}명 · 보관 ${arch}명${upd ? `\n\n⚠️ 이름이 바뀌면서 이전 답을 이어받는 학생이 ${upd}명 있어요.` : ''}${arch ? `\n\n보관된 학생은 목록·로그인에서 빠지지만 답 기록은 그대로 남아요.` : ''}`)) return;
    $('#saveR').disabled = true;
    let r; try { r = await T('/api/t/roster', { classes: PREVIEW, archive }); } catch (e) { toast(e.message, 'error'); $('#saveR').disabled = false; return; }
    toast(`${r.count}명 저장했어요 (추가 ${r.added} · 바뀜 ${r.updated}${r.restored ? ` · 보관 해제 ${r.restored}` : ''}${r.archived ? ` · 보관 ${r.archived}` : ''})`, 'ok');
    $('#pv').innerHTML = ''; $('#file').value = ''; CLS = PREVIEW[0].class_no; GRADE = PREVIEW[0].grade; localStorage.setItem('eng4-grade', GRADE); for (const c of PREVIEW) CLASS_COUNT[c.grade] = Math.max(CLASS_COUNT[c.grade] || 0, c.class_no); RSUB = 'list'; roster();
  };
}

// ---------------- 시험 링크·QR ----------------
let LINKSEL = null, CLOSED = new Set();
async function loadClosed() { try { CLOSED = new Set((await T('/api/t/settings')).closed); } catch {} }
const testUrl = (id) => `${location.origin}/t/${id}`;
function qrSVG(text, cell = 5) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: cell, margin: 2, scalable: true }); }
// 링크 복사 (클립보드 → 안 되면 예비 방법)
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); return ok;
}
function bindCopy(root) {
  root.querySelectorAll('[data-copyurl]').forEach((b) => (b.onclick = async (e) => {
    e.stopPropagation();
    const u = b.dataset.copyurl;
    if (await copyText(u)) {
      toast('링크를 복사했어요 📋');
      if (b.classList.contains('btn')) { const t = b.innerHTML; b.innerHTML = '✅ 복사됨'; b.classList.add('done'); setTimeout(() => { b.innerHTML = t; b.classList.remove('done'); }, 1500); }
    } else prompt('자동 복사가 안 돼요. 아래 링크를 길게 눌러(또는 Ctrl+C) 복사하세요', u);
  }));
}
// QR 크게 보기 (교실 화면에 띄우기 좋게)
function zoomQR(c) {
  const u = testUrl(c.id), sh = shell('QR 크게 보기', null, () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }), m = sh.m;
  m.innerHTML = `<div class="modal qrzoom"><div class="box">
    <div class="qz-top">${GRADE}학년 2학기 영어 ${CLOSED.has(c.id) ? '<span class="badge no">🔒 지금 닫혀 있어요</span>' : ''}</div>
    <div class="qz-title">${esc(c.kind === 'concept' ? `개념 ${c.id} · ${c.title}` : c.title)}</div>
    <div class="qz-qr">${qrSVG(u, 10)}</div>
    <button class="qz-url linkbtn" data-copyurl="${u}" title="눌러서 복사">${u}</button>
    <div class="qz-help">📱 QR을 찍거나 주소를 입력한 뒤, 이름과 학생 계정 ID로 들어가요</div>
    <div class="bar" style="justify-content:center"><button class="btn pri" data-copyurl="${u}">📋 링크 복사</button><button class="btn" id="qzFull">⛶ 전체 화면</button><button class="btn" id="x">닫기 (Esc)</button></div>
  </div></div>`;
  bindCopy(m);
  $('#x').onclick = () => sh.close();
  $('#qzFull').onclick = () => { const el = m.querySelector('.box'); (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen()).catch(() => {}); };
}
function linksView() {
  const sets = KG();
  if (!LINKSEL || LINKSEL.grade !== GRADE) LINKSEL = { grade: GRADE, ids: new Set(sets.filter((c) => c.kind !== 'concept').map((c) => c.id)) };
  const kindName = { concept: '📘 기본 개념', word: '🔤 단어 시험', spelltest: '✍️ 철자 시험', exam: '📝 단원평가' };
  const groups = []; for (const c of sets) { const g = c.kind === 'concept' ? '📘 기본 개념' : `📝 ${c.unit}`; const last = groups[groups.length - 1]; if (last && last[0] === g) last[1].push(c); else groups.push([g, [c]]); }
  app.innerHTML = `<div class="ctx noprint">${gradeTabs()}<span style="flex:1"></span>
      <button class="btn sm" id="lkAll">전체 선택</button><button class="btn sm ghost" id="lkNone">선택 해제</button><button class="btn sm pri" id="lkPrint">🖨 고른 QR 카드 출력 (${LINKSEL.ids.size})</button></div>
    <div class="notice noprint small">🔓 <b>열린 시험만</b> 학생 화면에서 풀 수 있어요. 닫힌 시험은 학생 목록에 🔒로 보이고 제출할 수 없어요 (이미 본 결과는 볼 수 있어요).<br>학생이 링크나 QR로 들어와 로그인하면 그 시험이 바로 열려요. 학생 첫 화면 주소: <button class="linkbtn" data-copyurl="${location.origin}" title="눌러서 복사">${location.origin}</button> <button class="btn sm" data-copyurl="${location.origin}">📋 복사</button></div>
    <div class="bar noprint"><b>${GRADE}학년: 열림 ${sets.filter((c) => !CLOSED.has(c.id)).length} · 닫힘 ${sets.filter((c) => CLOSED.has(c.id)).length}</b></div>
    ${groups.map(([g, cs]) => `<div class="grphead noprint"><h3 class="grp">${g}</h3><button class="btn sm" data-open="${cs.map((c) => c.id).join(',')}">모두 열기</button><button class="btn sm ghost" data-close="${cs.map((c) => c.id).join(',')}">모두 닫기</button></div><div class="lkgrid noprint">${cs.map((c) => `
      <div class="lk ${LINKSEL.ids.has(c.id) ? 'on' : ''} ${CLOSED.has(c.id) ? 'off' : ''}">
        <label class="lkchk"><input type="checkbox" data-lk="${c.id}" ${LINKSEL.ids.has(c.id) ? 'checked' : ''}> 출력</label>
        <button class="lkqr" data-zoom="${c.id}" title="눌러서 크게 보기">${qrSVG(testUrl(c.id), 3)}<span class="zoomhint">🔍 크게</span></button>
        <div class="lkinfo"><div class="small muted">${c.kind === 'concept' ? `개념 ${c.id}` : `${esc(c.unit)} · ${kindName[c.kind]}`}</div>
          <b>${esc(c.title)}</b>
          <button class="lkurl linkbtn" data-copyurl="${testUrl(c.id)}" title="눌러서 복사">${testUrl(c.id)}</button>
          <div class="bar" style="margin:6px 0 0"><label class="sw2"><input type="checkbox" data-tog="${c.id}" ${CLOSED.has(c.id) ? '' : 'checked'}><i></i>${CLOSED.has(c.id) ? '🔒 닫힘' : '🔓 열림'}</label></div>
          <div class="bar" style="margin:6px 0 0"><button class="btn sm" data-copyurl="${testUrl(c.id)}">📋 링크 복사</button><a class="btn sm ghost" href="/?preview=${c.id}" target="_blank">👀 미리보기</a></div></div>
      </div>`).join('')}</div>`).join('')}
    <div id="qrPrint"></div>`;
  app.querySelectorAll('[data-grade]').forEach((b) => (b.onclick = () => { GRADE = +b.dataset.grade; localStorage.setItem('eng4-grade', GRADE); linksView(); }));
  app.querySelectorAll('[data-lk]').forEach((x) => (x.onchange = () => { x.checked ? LINKSEL.ids.add(+x.dataset.lk) : LINKSEL.ids.delete(+x.dataset.lk); linksView(); }));
  const setOpen = async (ids, enabled) => { const r = await T('/api/t/settings', { concepts: ids, enabled }); CLOSED = new Set(r.closed); toast(enabled ? `${ids.length}개 열었어요` : `${ids.length}개 닫았어요`); linksView(); };
  app.querySelectorAll('[data-tog]').forEach((x) => (x.onchange = () => setOpen([+x.dataset.tog], x.checked)));
  app.querySelectorAll('[data-open]').forEach((b) => (b.onclick = () => setOpen(b.dataset.open.split(',').map(Number), true)));
  app.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => { if (confirm('이 묶음의 시험을 모두 닫을까요? 학생들이 풀 수 없게 돼요.')) setOpen(b.dataset.close.split(',').map(Number), false); }));
  $('#lkAll').onclick = () => { sets.forEach((c) => LINKSEL.ids.add(c.id)); linksView(); };
  $('#lkNone').onclick = () => { LINKSEL.ids.clear(); linksView(); };
  bindCopy(app);
  app.querySelectorAll('[data-zoom]').forEach((b) => (b.onclick = () => zoomQR(sets.find((c) => c.id === +b.dataset.zoom))));
  $('#lkPrint').onclick = () => {
    const chosen = sets.filter((c) => LINKSEL.ids.has(c.id));
    if (!chosen.length) return alert('출력할 시험을 골라 주세요');
    $('#qrPrint').innerHTML = `<div class="qrcards">${chosen.map((c) => `<div class="qrcard">
        <div class="qc-top">${GRADE}학년 2학기 영어</div>
        <div class="qc-title">${esc(c.kind === 'concept' ? `개념 ${c.id} · ${c.title}` : c.title)}</div>
        <div class="qc-qr">${qrSVG(testUrl(c.id), 6)}</div>
        <div class="qc-url">${testUrl(c.id)}</div>
        <div class="qc-help">📱 QR을 찍거나 주소를 입력한 뒤, 이름과 학생 계정 ID로 들어가요</div></div>`).join('')}</div>`;
    printOnly($('#qrPrint'));
  };
}

// ---------------- 문제·정답 ----------------
function keyView() {
  const sets = KG();
  if (!sets.some((c) => c.id === KEYSEL)) KEYSEL = sets[0] && sets[0].id;
  const groups = [];
  for (const c of sets) { const g = c.kind === 'concept' ? '📘 기본 개념' : `📝 ${c.unit}`; const last = groups[groups.length - 1]; if (last && last[0] === g) last[1].push(c); else groups.push([g, [c]]); }
  const kindName = { concept: '', word: '🔤 단어 시험', spelltest: '✍️ 철자 시험', exam: '📝 단원평가' };
  const c = sets.find((x) => x.id === KEYSEL);
  app.innerHTML = `<div class="ctx noprint">${gradeTabs()}<span style="flex:1"></span>${KEYSEL ? `<a class="btn sm" href="/?preview=${KEYSEL}" target="_blank">👀 학생 화면으로 미리보기</a>` : ''}<button class="btn sm" onclick="print()">🖨 이 세트 인쇄</button></div>
  <div class="layout2">
    <nav class="side noprint">${groups.map(([g, cs]) => `<div class="sg">${g}</div>${cs.map((x) => `<button class="si ${x.id === KEYSEL ? 'on' : ''}" data-key="${x.id}">${x.kind === 'concept' ? `${x.id}. ${esc(x.title)}` : kindName[x.kind]}<span class="muted"> ${x.questions.length}</span></button>`).join('')}`).join('')}</nav>
    <section>${c ? `<div class="card"><h3 style="margin-top:0">${c.kind === 'concept' ? qLabel(c) + ' · ' : ''}${esc(c.title)} <span class="muted small">(${esc(c.unit)}, ${c.questions.length}문제)</span></h3>
      <ol class="keylist">${c.questions.map((q) => `<li>${optLabel(q.q)}${qExtra(q)}${q.say ? ` <span class="muted">(🔊 ${esc(q.say)})</span>` : ''}${q.clock ? ` <span class="muted">(시계 ${q.clock[0]}:${String(q.clock[1]).padStart(2, '0')})</span>` : ''}${q.money ? ` <span class="muted">(${q.money.c100 ? '100원×' + q.money.c100 : ''}${q.money.b1000 ? '1000원×' + q.money.b1000 : ''})</span>` : ''}${q.opts ? `<div class="muted small">[${q.opts.map(optLabel).join(' / ')}]</div>` : ''}<div>→ <b style="color:var(--ok)">${optLabel(q.answerText)}</b></div></li>`).join('')}</ol></div>` : '<p class="muted">문제가 없어요.</p>'}</section>
  </div>`;
  app.querySelectorAll('[data-grade]').forEach((b) => (b.onclick = () => { GRADE = +b.dataset.grade; localStorage.setItem('eng4-grade', GRADE); KEYSEL = null; keyView(); }));
  app.querySelectorAll('[data-key]').forEach((b) => (b.onclick = () => { KEYSEL = +b.dataset.key; keyView(); scrollTo(0, 0); }));
}

TOKEN ? boot() : login();
</script>
