<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4학년 2학기 영어 · 기본 개념 정리와 확인 문제</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/style.css"><base href="/"></head>
<body class="role-student">
<header class="top"><div class="wrap"><h1><span class="dag">†</span> <span id="ttl">2학기 영어</span></h1><span id="who" class="muted"></span><button id="out" class="btn sm ghost" hidden>나가기</button></div></header>
<main class="wrap" id="app"><p class="muted">불러오는 중…</p></main>
<script src="/common.js"></script>
<script>
let CONCEPTS = [], UNITS = [], ME = null, SUBS = {}, RETAKE = {}, MENU = safeGetLS('eng4-menu') || 'concept';
const DETAIL_CACHE = {};
const app = $('#app');
const LS = 'eng4-student-token';
let VIEW_SEQ = 0;

let TOKEN = null;
let DRAFT_SAVE_FAILED = false;
let BEFORE_UNLOAD_BOUND = false;
function setDraftSaveFailed(failed) {
  DRAFT_SAVE_FAILED = !!failed;
  if (DRAFT_SAVE_FAILED && !BEFORE_UNLOAD_BOUND && typeof window !== 'undefined' && window.addEventListener) {
    BEFORE_UNLOAD_BOUND = true;
    window.addEventListener('beforeunload', (e) => {
      if (DRAFT_SAVE_FAILED) { e.preventDefault(); e.returnValue = ''; }
    });
  }
}
const S = (path, body) => api(path, body, TOKEN).catch((e) => { if (e.status === 401 && TOKEN) { logout(false); } throw e; });

function safeGetLS(k) {
  try { return localStorage.getItem(k); } catch { return null; }
}
function safeSetLS(k, v) {
  try { localStorage.setItem(k, v); return true; } catch { return false; }
}
function safeRemoveLS(k) {
  try { localStorage.removeItem(k); } catch {}
}
const STUDENT_THEME_KEY = 'eng4-student-theme';
function applyStudentTheme(name) {
  const t = ['default', 'dual', 'playful', 'crisp'].includes(name) ? name : 'default';
  if (typeof document !== 'undefined' && document.documentElement) document.documentElement.dataset.theme = t;
  return t;
}
applyStudentTheme(safeGetLS(STUDENT_THEME_KEY));
async function syncStudentTheme() {
  try {
    const d = await api('/api/theme');
    if (d && d.studentTheme) {
      const t = applyStudentTheme(d.studentTheme);
      safeSetLS(STUDENT_THEME_KEY, t);
    }
  } catch {}
}

// ---------- 임시저장 / 문항 fingerprint / 완성도 검사 (테스트 가능한 순수 로직 포함) ----------
const DRAFT_PREFIX = 'eng4-draft:';
function draftKey(studentId, conceptId, attempt) {
  return `${DRAFT_PREFIX}${studentId}:${conceptId}:${attempt}`;
}
function currentAttempt(conceptId) {
  return (RETAKE[conceptId] || 0) + 1;
}
function fingerprintQuestions(questions) {
  if (!Array.isArray(questions)) return '';
  const raw = questions.map((q) => [
    q.t || '',
    q.q || '',
    q.pat || '',
    q.blanks || 0,
    Array.isArray(q.opts) ? q.opts.join('|') : '',
    Array.isArray(q.words) ? q.words.join('|') : '',
    Array.isArray(q.sel) ? q.sel.map((s) => s.join(',')).join('|') : '',
  ].join('~')).join(';;');
  let h = 2166136261;
  for (let i = 0; i < raw.length; i++) {
    h ^= raw.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36) + ':' + questions.length;
}
function conceptFingerprint(c) {
  const qfp = Array.isArray(c.questions) ? fingerprintQuestions(c.questions) : `n:${c.questionCount || 0}`;
  return c.contentVersion != null ? `v${c.contentVersion}:${qfp}` : qfp;
}
function questionCountOf(c) {
  return Array.isArray(c.questions) ? c.questions.length : (c.questionCount || 0);
}
function blankAnswerFor(q) {
  if (q.t === 'multi') return Array(q.blanks || (q.a ? q.a.length : 0)).fill('');
  if (q.t === 'spellmean') return ['', ''];
  if (q.t === 'spell') return Array(((q.pat || '').match(/__/g) || []).length).fill('');
  if (q.t === 'pick' || q.t === 'order') return [];
  return '';
}
function isBlankAnswer(q, a) {
  if (a == null) return true;
  if (Array.isArray(a)) return a.every((x) => !String(x ?? '').trim());
  return !String(a).trim();
}
function questionCompleteness(q, a) {
  if (q.t === 'spellmean') {
    const arr = Array.isArray(a) ? a : ['', ''];
    const n = [0, 1].filter((k) => String(arr[k] ?? '').trim().length > 0).length;
    return n === 0 ? 'empty' : n === 2 ? 'complete' : 'partial';
  }
  if (q.t === 'multi') {
    const req = q.blanks || (Array.isArray(q.sel) ? q.sel.length : 0) || (Array.isArray(a) ? a.length : 0);
    const arr = Array.isArray(a) ? a : [];
    const n = Array.from({ length: req }, (_, k) => String(arr[k] ?? '').trim().length > 0).filter(Boolean).length;
    return n === 0 ? 'empty' : n >= req ? 'complete' : 'partial';
  }
  if (q.t === 'spell') {
    const req = ((q.pat || '').match(/__/g) || []).length;
    const arr = Array.isArray(a) ? a : [];
    const n = Array.from({ length: req }, (_, k) => String(arr[k] ?? '').trim().length > 0).filter(Boolean).length;
    return n === 0 ? 'empty' : n >= req ? 'complete' : 'partial';
  }
  if (q.t === 'order') {
    const req = Array.isArray(q.words) ? q.words.length : 0;
    const n = Array.isArray(a) ? a.length : 0;
    return n === 0 ? 'empty' : n >= req ? 'complete' : 'partial';
  }
  if (q.t === 'pick') {
    return Array.isArray(a) && a.length > 0 ? 'complete' : 'empty';
  }
  return String(a ?? '').trim().length > 0 ? 'complete' : 'empty';
}
function inspectAnswers(questions, answers) {
  const empty = [], partial = [];
  let completeCount = 0;
  questions.forEach((q, i) => {
    const st = questionCompleteness(q, answers[i]);
    if (st === 'empty') empty.push(i);
    else if (st === 'partial') partial.push(i);
    else completeCount++;
  });
  return { empty, partial, completeCount, total: questions.length };
}
function saveDraft(studentId, c, attempt, answers) {
  const key = draftKey(studentId, c.id, attempt);
  const payload = {
    studentId,
    conceptId: c.id,
    attempt,
    contentVersion: c.contentVersion ?? null,
    fingerprint: conceptFingerprint(c),
    savedAt: new Date().toISOString(),
    answers,
  };
  const ok = safeSetLS(key, JSON.stringify(payload));
  return { ok, savedAt: payload.savedAt, key };
}
function loadDraft(studentId, c, attempt) {
  const raw = safeGetLS(draftKey(studentId, c.id, attempt));
  if (!raw) return { status: 'none' };
  let data;
  try { data = JSON.parse(raw); } catch { return { status: 'corrupt' }; }
  if (!data || data.studentId !== studentId || data.conceptId !== c.id || data.attempt !== attempt) {
    return { status: 'mismatch' };
  }
  if (Array.isArray(c.questions)) {
    if (data.fingerprint !== conceptFingerprint(c)) return { status: 'version-mismatch' };
    if (!Array.isArray(data.answers) || data.answers.length !== c.questions.length) return { status: 'version-mismatch' };
  } else if (c.contentVersion != null && data.contentVersion != null && data.contentVersion !== c.contentVersion) {
    return { status: 'version-mismatch' };
  }
  return { status: 'ok', draft: data };
}
function clearDraft(studentId, conceptId, attempt) {
  safeRemoveLS(draftKey(studentId, conceptId, attempt));
}
function clearStudentDrafts(studentId) {
  if (studentId == null) return;
  const prefix = `${DRAFT_PREFIX}${studentId}:`;
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) keys.push(k);
    }
    keys.forEach((k) => localStorage.removeItem(k));
  } catch {}
}
function hasActiveDraft(studentId, c) {
  const res = loadDraft(studentId, c, currentAttempt(c.id));
  if (res.status !== 'ok') return false;
  const ans = res.draft.answers;
  return Array.isArray(ans) && ans.some((a) => !isBlankAnswer({}, a));
}
function fmtTime(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch { return ''; }
}

// ---------- 접근성 모달 헬퍼 ----------
function openAccessibleModal({ id, label, html, initialFocusSelector, onMount }) {
  const m = document.createElement('div');
  m.className = 'modal';
  if (id) m.id = id;
  m.innerHTML = html;
  document.body.appendChild(m);

  let trap = null;
  let closed = false;
  const prevFocus = document.activeElement;
  const onKeyFallback = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); close(true); return; }
    if (e.key === 'Tab') {
      const focusables = [...m.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };

  const close = (restoreFocusFlag = true) => {
    if (closed) return;
    closed = true;
    if (trap) trap.release();
    else document.removeEventListener('keydown', onKeyFallback);
    m.remove();
    if (!trap && restoreFocusFlag && prevFocus && typeof prevFocus.focus === 'function') prevFocus.focus();
  };

  if (typeof trapModal === 'function') {
    trap = trapModal(m, { label, onClose: () => close(true) });
  } else {
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');
    if (label) m.setAttribute('aria-label', label);
    document.addEventListener('keydown', onKeyFallback);
    m.onclick = (e) => { if (e.target === m) close(true); };
  }

  if (onMount) onMount(m, close);
  const initEl = (initialFocusSelector && m.querySelector(initialFocusSelector)) || m.querySelector('button, [tabindex]');
  if (initEl) initEl.focus();
  return { modal: m, close };
}

// /t/25 처럼 들어오면 로그인 뒤 그 시험을 바로 엶
let GO = (location.pathname.match(/^\/t\/(\d+)/) || [])[1] || sessionStorage.getItem('eng4-go');
if (GO) sessionStorage.setItem('eng4-go', GO);
function goTarget() {
  if (!GO) return false;
  const id = +GO; GO = null; sessionStorage.removeItem('eng4-go'); history.replaceState(null, '', '/');
  const c = CONCEPTS.find((x) => x.id === id);
  if (!c) { home(); app.insertAdjacentHTML('afterbegin', '<div class="notice">이 링크의 시험은 우리 학년 시험이 아니에요. 아래 목록에서 골라 주세요.</div>'); return true; }
  if (c.kind !== 'concept') MENU = 'unit';
  concept(id); return true;
}

// ---------- 교사 미리보기: /?preview=번호 ----------
const PREVIEW_ID = +new URLSearchParams(location.search).get('preview') || 0;
async function previewMode(id) {
  VIEW_SEQ++;
  const tt = safeGetLS('eng4-teacher');
  if (!tt) { app.innerHTML = '<div class="notice">미리보기는 교사 화면에 로그인한 뒤에 열 수 있어요. <a href="/teacher">교사 화면으로 가기</a></div>'; return; }
  let key;
  try { key = (await api('/api/t/key', null, tt)).concepts; } catch (e) { app.innerHTML = `<div class="notice">${esc(e.message)} <a href="/teacher">교사 화면으로 가기</a></div>`; return; }
  MEDIA_TOKEN = tt;
  const c = key.find((x) => x.id === id); if (!c) { app.innerHTML = '<div class="notice">시험을 찾을 수 없어요.</div>'; return; }
  c.questions.forEach((q) => { if (q.t === 'multi') q.blanks = q.a.length; });
  const same = key.filter((x) => x.grade === c.grade);
  $('#ttl').textContent = `${c.grade}학년 2학기 영어 · 교사 미리보기`;
  document.title = '미리보기 · ' + c.title;
  const ans = c.questions.map(blankAnswerFor);
  app.innerHTML = `<div class="pvbar"><span class="pvt"><b>${ico('eye', 15)} 교사 미리보기</b> · 풀어 볼 수 있지만 <b>제출·저장되지 않아요</b></span>
      <select id="pvSel" class="field" aria-label="미리보기 시험 선택">${same.map((x) => `<option value="${x.id}" ${x.id === id ? 'selected' : ''}>${esc(x.kind === 'concept' ? `개념 ${x.id} · ${x.title}` : x.title)}</option>`).join('')}</select></div>
    <h2><span class="dag">†</span> ${c.kind === 'concept' ? '개념 ' + c.id + ' · ' : ''}${esc(c.title)}</h2><p class="lead">${esc(c.lead || '')}</p>
    <div class="notice small">${ico('lock', 14)} 학생에게는 아래 정리가 <b>문제를 낸 뒤에만</b> 보여요. (교사 미리보기라서 보임)</div>
    <div id="sum">${fillSummary(c.summary)}</div>
    <h2 style="margin-top:28px">${ico('pen', 20)} ${c.kind === 'concept' ? '확인 문제' : esc(c.title)} <span class="muted small">(${c.questions.length}문제)</span></h2>
    <div id="qarea">${c.questions.map((q, i) => `<div class="q" id="q${i}"><div class="qh"><div class="qn">${i + 1}</div><div class="qt">${optLabel(q.q)}</div><div class="mark"></div></div>${mediaHTML(q)}<div class="ans"></div><div class="fb pvans" hidden>정답: <span class="right">${optLabel(q.answerText)}</span></div></div>`).join('')}</div>
    <div class="sticky-foot"><button class="btn pri" id="pvTry">${ico('check', 16)} 채점해 보기</button> <button class="btn" id="pvKey">${ico('eye', 16)} 정답 보기</button> <button class="btn ghost" id="pvReset">↺ 지우기</button></div>`;
  bindSpeak($('#sum'));
  app.querySelectorAll('[data-say]').forEach((b) => (b.onclick = () => speak(b.dataset.say)));
  c.questions.forEach((q, i) => renderInput(q, i, ans, app.querySelector(`#q${i} .ans`)));
  $('#pvSel').onchange = () => { location.search = '?preview=' + $('#pvSel').value; };
  $('#pvKey').onclick = () => { const show = $('#pvKey').textContent.includes('보기'); app.querySelectorAll('.pvans').forEach((x) => (x.hidden = !show)); $('#pvKey').innerHTML = show ? `${ico('eyeOff', 16)} 정답 숨기기` : `${ico('eye', 16)} 정답 보기`; };
  $('#pvReset').onclick = () => previewMode(id);
  $('#pvTry').onclick = async () => {
    const r = await api('/api/t/try', { concept: id, answers: ans }, tt);
    r.marks.forEach((ok, i) => { const q = $(`#q${i}`); q.classList.toggle('ok', ok); q.classList.toggle('no', !ok); const m = q.querySelector('.mark'); m.className = 'mark ' + (ok ? 'ok' : 'no'); m.textContent = ok ? 'O' : 'X'; });
    toast(`채점해 보기: ${r.marks.filter(Boolean).length} / ${c.questions.length} (저장 안 됨)`);
  };
}

async function start() {
  syncStudentTheme();
  if (PREVIEW_ID) return previewMode(PREVIEW_ID);
  TOKEN = safeGetLS(LS);
  if (TOKEN) { try { await loadMe(); return goTarget() || home(); } catch { safeRemoveLS(LS); TOKEN = null; } }
  login();
}
async function loadMe() {
  syncStudentTheme();
  const d = await S('/api/me');
  MEDIA_TOKEN = TOKEN; ME = d.student; SUBS = {}; RETAKE = d.retake || {}; d.submissions.forEach((s) => (SUBS[s.concept] = s));
  const c = await S('/api/concepts?lite=1');
  CONCEPTS = c.concepts; UNITS = c.units || [];
  CONCEPTS.forEach((x) => { if (Array.isArray(x.questions)) DETAIL_CACHE[x.id] = x; });
  $('#ttl').textContent = `${ME.grade}학년 2학기 영어`;
  $('#who').textContent = `${ME.class_no}반 ${ME.number}번 ${ME.name}`;
  $('#out').hidden = false;
}
async function loadConceptDetail(id) {
  const base = CONCEPTS.find((x) => x.id === id);
  if (base && Array.isArray(base.questions)) return base;
  const cached = DETAIL_CACHE[id];
  if (cached && Array.isArray(cached.questions) && (!base || cached.contentVersion === base.contentVersion)) {
    return base ? { ...cached, ...base, questions: cached.questions, summary: cached.summary ?? base.summary } : cached;
  }
  const d = await S(`/api/concept?concept=${id}`);
  const full = d.concept || d;
  DETAIL_CACHE[id] = full;
  return base ? { ...full, ...base, questions: full.questions, summary: full.summary ?? base.summary } : full;
}
function logout(clearDrafts = true) {
  if (clearDrafts && ME && ME.id != null) clearStudentDrafts(ME.id);
  safeRemoveLS(LS); TOKEN = null; ME = null; CONCEPTS = []; UNITS = [];
  Object.keys(DETAIL_CACHE).forEach((k) => delete DETAIL_CACHE[k]);
  $('#ttl').textContent = '2학기 영어'; $('#who').textContent = ''; $('#out').hidden = true;
  login();
}
$('#out').onclick = () => { if (confirm('나갈까요? 저장하지 않은 임시답안은 이 기기에서 지워져요.')) logout(true); };

// ⭐ 즐겨찾기 추가: 브라우저가 사이트의 즐겨찾기 추가를 막으므로, 기기에 맞는 방법을 크게 안내
function showBookmarkHelp() {
  const ua = navigator.userAgent, url = location.origin + '/';
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/i.test(ua), mac = !ios && /Mac/i.test(navigator.platform || ua);
  let how;
  if (ios) how = `<p class="fav-key">공유 <span class="k">⬆︎</span> 버튼</p><p>화면 위나 아래의 <b>공유 버튼</b>을 누른 뒤<br><b>‘책갈피 추가’</b> 또는 <b>‘홈 화면에 추가’</b>를 눌러요.</p>`;
  else if (android) how = `<p class="fav-key">메뉴 <span class="k">⋮</span> → <span class="k">☆</span></p><p>브라우저 오른쪽 위 <b>⋮ 메뉴</b>를 누른 뒤<br><b>☆(별)</b> 또는 <b>‘홈 화면에 추가’</b>를 눌러요.</p>`;
  else how = `<p class="small muted" style="margin:0 0 6px">${mac ? '맥' : '웨일북 · 컴퓨터'}</p><p class="fav-key"><span class="k">${mac ? '⌘' : 'Ctrl'}</span> + <span class="k">D</span></p><p>키보드에서 <b>${mac ? '⌘(command)' : 'Ctrl'}</b> 키를 누른 채 <b>D</b>를 누르면<br>즐겨찾기 창이 열려요. <b>완료</b>(또는 <b>저장</b>)를 눌러요.</p><p class="small muted">${/Whale/i.test(ua) ? '웨일' : '브라우저'} 주소창 오른쪽의 ☆(별)을 눌러도 돼요.</p>`;
  openAccessibleModal({
    id: 'favModal',
    label: '즐겨찾기 추가',
    initialFocusSelector: '#favOk',
    html: `<div class="box" style="max-width:520px;text-align:center">
      <h2 style="margin-top:0">${ico('star', 22)} 즐겨찾기 추가</h2>
      <p class="muted">다음부터 이 주소로 바로 들어올 수 있어요</p>
      <div class="fav-how">${how}</div>
      <p class="fav-url">${esc(url)}</p>
      <div class="bar" style="justify-content:center"><button type="button" class="btn" id="favCopy">${ico('copy')} 주소 복사</button><button type="button" class="btn pri" id="favOk">알겠어요</button></div></div>`,
    onMount: (m, close) => {
      m.querySelector('#favOk').onclick = () => close(true);
      m.querySelector('#favCopy').onclick = async () => {
        let ok = false;
        try { await navigator.clipboard.writeText(url); ok = true; } catch {
          const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
          try { ok = document.execCommand('copy'); } catch {} ta.remove();
        }
        ok ? toast('주소를 복사했어요') : prompt('이 주소를 복사하세요', url);
      };
    },
  });
}

function login(msg) {
  VIEW_SEQ++;
  setDraftSaveFailed(false);
  app.innerHTML = `<div class="center-screen"><img class="illus illus-hero" src="/img/mascot-welcome.jpg" alt=""><h2>안녕하세요!</h2><p class="lead">이름과 학생 계정 ID를 써서 들어와요.${GO ? '<br><b>들어가면 바로 시험이 열려요.</b>' : ''}</p>
  <form id="lf" class="card">
    <label class="small muted" for="nm">이름</label>
    <input id="nm" class="field" style="width:100%;font-size:19px;margin:4px 0 14px" autocomplete="off" placeholder="예: 김하늘">
    <label class="small muted" for="sid">학생 계정 ID</label>
    <input id="sid" class="field" style="width:100%;font-size:19px;margin:4px 0 14px" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: 00gs00e000">
    <div id="lmsg" role="alert">${msg ? `<div class="notice">${esc(msg)}</div>` : ''}</div>
    <button class="btn pri" style="width:100%;margin-top:6px">들어가기</button>
  </form></div>
  <button type="button" class="favbtn" id="fav">${ico('star', 18)} 즐겨찾기 추가</button>`;
  $('#fav').onclick = showBookmarkHelp;
  $('#nm').focus();
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#lf button'); btn.disabled = true;
    try {
      const d = await api('/api/login', { name: $('#nm').value, id: $('#sid').value });
      TOKEN = d.token; safeSetLS(LS, TOKEN);
      await loadMe(); goTarget() || home();
    } catch (err) { $('#lmsg').innerHTML = `<div class="notice">${esc(err.message)}</div>`; btn.disabled = false; }
  };
}

function tileState(s, c) {
  const n = questionCountOf(c);
  if (!s && c.open === false) {
    return { badge: `<span class="badge">${ico('lock', 13)} 아직 열리지 않았어요</span>`, cta: '열리면 풀 수 있어요' };
  }
  if (s && s.status === 'graded') {
    const note = s.note ? ` <span class="badge note">${ico('chat', 13)} 선생님 말씀</span>` : '';
    return {
      badge: `<span class="badge ${s.score >= n * 0.8 ? 'ok' : 'no'}">채점 완료 · ${s.score}/${n}</span>${note}`,
      cta: '결과 확인 →',
    };
  }
  if (s) {
    return {
      badge: `<span class="badge wait">${ico('clock', 13)} 제출 완료 · 채점 기다리는 중</span>`,
      cta: c.kind === 'concept' && !c.locked ? '고쳐서 다시 내기 →' : '제출 상태 보기',
    };
  }
  if (ME && hasActiveDraft(ME.id, c)) {
    return { badge: `<span class="badge draft">${ico('pen', 13)} 이어서 풀기</span>`, cta: '이어서 풀기 →' };
  }
  return { badge: '<span class="badge">지금 풀 시험</span>', cta: '문제 풀기 →' };
}

const unitColorIdx = (c) => {
  const m = String(c.unit || '').match(/\d+/);
  return m ? (Math.abs(parseInt(m[0], 10) - 7) % 5) : (c.id % 5);
};
const tileHTML = (c) => {
  const n = questionCountOf(c);
  const st = tileState(SUBS[c.id], c);
  const retakeBadge = !SUBS[c.id] && RETAKE[c.id] && c.open !== false
    ? `<span class="badge wait">${ico('retry', 13)} ${RETAKE[c.id] + 1}차 다시 풀기</span>`
    : SUBS[c.id] && SUBS[c.id].attempt > 1 ? `<span class="badge">${SUBS[c.id].attempt}차</span>` : '';
  return `<button type="button" class="tile${c.open === false && !SUBS[c.id] ? ' closed' : ''}" data-k="${c.id}" data-u="${unitColorIdx(c)}">
    <span class="num">${c.kind === 'concept' ? `개념 ${c.id} · ${esc(c.unit)}` : `${c.kind === 'word' ? `${ico('word', 14)} 단어 시험` : c.kind === 'spelltest' ? `${ico('pen', 14)} 철자 시험` : `${ico('note', 14)} 단원평가`} · ${n}문제`}</span>
    <div class="ttl">${esc(c.title)}</div>
    <div class="tile-foot"><span>${st.badge} ${retakeBadge}</span><span class="tile-cta">${st.cta}</span></div>
  </button>`;
};

function home() {
  const seq = ++VIEW_SEQ;
  setDraftSaveFailed(false);
  scrollTo(0, 0);
  const hasConcepts = CONCEPTS.some((c) => c.kind === 'concept');
  if (!hasConcepts) MENU = 'unit';
  const openSets = CONCEPTS.filter((c) => c.open !== false);
  const doneOpen = openSets.filter((c) => SUBS[c.id]).length;
  const closedDone = CONCEPTS.filter((c) => c.open === false && SUBS[c.id]).length;
  const pct = openSets.length ? (doneOpen / openSets.length * 100) : 0;
  app.innerHTML = `<div class="home-hero"><img class="illus illus-home" src="/img/mascot-cheer.jpg" alt=""><h2>${esc(ME.name)}, 오늘도 화이팅!</h2></div>
  <p class="lead">세트를 눌러 문제를 풀거나 결과를 확인해요. <span class="small">(기본 개념은 채점 전까지 다시 낼 수 있고, 단어·철자·단원평가는 1회 평가예요)</span></p>
  <div class="bar"><b>열린 시험 제출 ${doneOpen} / ${openSets.length}</b>${closedDone ? ` <span class="small muted">(닫힌 시험 제출 ${closedDone}건)</span>` : ''}<div class="progress" role="progressbar" aria-label="열린 시험 제출 진행률" aria-valuenow="${doneOpen}" aria-valuemin="0" aria-valuemax="${openSets.length}"><i style="width:${pct}%"></i></div><button type="button" class="btn sm" id="rf">${ico('retry', 14)} 새로고침</button><button type="button" class="btn sm" id="allr">${ico('note', 14)} 내 결과 모아 보기·출력</button></div>
  ${hasConcepts ? `<div class="tabs menu" role="tablist" aria-label="시험 분류"><button type="button" role="tab" aria-selected="${MENU === 'concept'}" class="tab ${MENU === 'concept' ? 'on' : ''}" data-menu="concept">${ico('book', 17)} 기본 개념</button><button type="button" role="tab" aria-selected="${MENU === 'unit'}" class="tab ${MENU === 'unit' ? 'on' : ''}" data-menu="unit">${ico('note', 17)} 단원 평가</button></div>` : `<h3 class="grp">${ico('note', 19)} 단원 평가</h3>`}
  ${MENU === 'unit' ? UNITS.map((u) => {
    const sets = CONCEPTS.filter((c) => c.ukey === u.key);
    const word = sets.find((c) => c.kind === 'word'), exams = sets.filter((c) => c.kind === 'exam');
    return `<h3 class="grp">${esc(u.name)}${u.title !== u.name ? ' · ' + esc(u.title) : ''}</h3><div class="grid g-concepts">
      ${word ? tileHTML(word) : ''}
      ${sets.filter((c) => c.kind === 'spelltest').map(tileHTML).join('')}
      ${exams.length ? exams.map(tileHTML).join('') : `<div class="tile soon"><span class="num">${esc(u.name)}</span><div class="ttl">단원평가 문제지</div><span class="badge">준비 중</span></div>`}</div>`;
  }).join('') : `<h3 class="grp">${ico('book', 19)} 기본 개념 정리 · 확인 문제 (10문제씩)</h3>
  <div class="grid g-concepts">${CONCEPTS.filter((c) => c.kind === 'concept').map(tileHTML).join('')}</div>`}`;
  app.querySelectorAll('[data-menu]').forEach((b) => (b.onclick = () => { MENU = b.dataset.menu; safeSetLS('eng4-menu', MENU); home(); }));
  app.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => concept(+b.dataset.k)));
  $('#rf').onclick = async () => {
    const btn = $('#rf'); btn.disabled = true;
    try { await loadMe(); if (seq === VIEW_SEQ) home(); }
    catch (e) { toast(e.message); btn.disabled = false; }
  };
  $('#allr').onclick = allResults;
}

async function concept(id) {
  const seq = ++VIEW_SEQ;
  scrollTo(0, 0);
  const summaryMeta = CONCEPTS.find((x) => x.id === id);
  if (!summaryMeta) {
    app.innerHTML = `<button type="button" class="btn sm" id="back">← 목록</button><div class="notice">시험을 찾을 수 없어요.</div>`;
    $('#back').onclick = home;
    return;
  }
  const backLabel = summaryMeta.kind === 'concept' ? '← 개념 목록' : '← 단원 평가 목록';
  const goHomeSafe = () => {
    if (DRAFT_SAVE_FAILED && !confirm('이 기기에서는 임시저장이 되지 않았어요. 목록으로 나가면 입력한 답이 사라집니다. 그래도 나갈까요?')) return;
    setDraftSaveFailed(false);
    home();
  };
  app.innerHTML = `<button type="button" class="btn sm" id="back">${backLabel}</button><p class="muted">불러오는 중…</p>`;
  $('#back').onclick = goHomeSafe;

  let c;
  try { c = await loadConceptDetail(id); } catch (e) {
    if (seq !== VIEW_SEQ) return;
    app.innerHTML = `<button type="button" class="btn sm" id="back">${backLabel}</button><div class="notice">${esc(e.message)}</div>`;
    $('#back').onclick = goHomeSafe;
    return;
  }
  if (seq !== VIEW_SEQ) return;

  const s = SUBS[id];
  const n = questionCountOf(c);
  const ruleText = c.kind === 'concept'
    ? '연습 · 채점 전까지는 고쳐서 다시 낼 수 있어요.'
    : '1회 평가 · 한 번 제출하면 바꿀 수 없어요.';
  app.innerHTML = `<button type="button" class="btn sm" id="back">${backLabel}</button>
  <h2><span class="dag">†</span> ${c.kind === 'concept' ? '개념 ' + c.id + ' · ' : ''}${esc(c.title)}</h2>
  <p class="lead">${esc(c.lead || '')}${c.hidden && !s ? '' : ` <span class="small">(영어를 누르면 소리가 나와요 ${ico('sound', 14)})</span>`}</p>
  <p class="small muted" style="margin:-8px 0 12px">${ruleText}</p>
  <div id="sum">${c.hidden ? (s ? '<p class="muted">정리 내용을 불러오는 중…</p>' : `<div class="notice">${ico('lock', 15)} ${c.kind === 'concept' ? '개념 정리는 확인 문제를 낸 뒤에' : '낱말·표현 정리는 시험을 낸 뒤에'} 볼 수 있어요.</div>`) : fillSummary(c.summary || '')}</div>
  <div id="qarea"></div>`;
  $('#back').onclick = goHomeSafe;
  if (c.hidden && s) {
    try {
      const sumRes = await S(`/api/summary?concept=${id}`);
      if (seq !== VIEW_SEQ) return;
      $('#sum').innerHTML = `<h3 class="grp">${ico('book', 18)} 정리 (${c.kind === 'concept' ? '확인 문제를 내서' : '시험을 내서'} 열렸어요)</h3>${fillSummary(sumRes.summary)}`;
    } catch {
      if (seq === VIEW_SEQ) $('#sum').innerHTML = '';
    }
  }
  bindSpeak($('#sum'));
  const qa = $('#qarea');
  if (s && s.status === 'graded') {
    try {
      const d = await S(`/api/submission?concept=${id}`);
      if (seq !== VIEW_SEQ) return;
      showResult(c, d.submission, qa);
    } catch (e) {
      if (seq === VIEW_SEQ) qa.innerHTML = `<div class="notice">${esc(e.message)}</div>`;
    }
  } else {
    if (!s && c.open === false) { qa.innerHTML = `<div class="notice">${ico('lock', 15)} 이 시험은 아직 열리지 않았어요. 선생님이 열어 주시면 풀 수 있어요.</div>`; return; }
    if (s && c.locked) { qa.innerHTML = `<div class="notice ok">${ico('check', 15)} 시험을 냈어요. 선생님이 채점하면 결과를 볼 수 있어요.</div>`; return; }
    const hasDraft = ME && hasActiveDraft(ME.id, c);
    qa.innerHTML = `${s ? '<div class="notice">제출했어요. 선생님이 채점하기 전까지는 고쳐서 다시 낼 수 있어요.</div>' : ''}
      <div class="sticky-foot"><button type="button" class="btn pri" id="go">${ico('pen', 16)} ${c.kind === 'concept' ? '확인 문제' : '시험'} ${hasDraft ? '이어서 풀기' : (!s && RETAKE[c.id] ? `다시 풀기 (${RETAKE[c.id] + 1}차)` : '풀기')} (${n}문제)</button></div>`;
    $('#go').onclick = async () => {
      const goBtn = $('#go'); goBtn.disabled = true;
      let prev = null;
      if (s) {
        try {
          const subRes = await S(`/api/submission?concept=${id}`);
          if (seq !== VIEW_SEQ) return;
          prev = subRes.submission.answers;
        } catch {}
      }
      if (seq === VIEW_SEQ) quiz(c, prev, seq);
    };
  }
}

function quiz(c, prev, seq = VIEW_SEQ) {
  if (c.hidden) $('#sum').innerHTML = `<div class="notice">${ico('lock', 15)} ${c.kind === 'concept' ? '문제를 푸는' : '시험 보는'} 동안에는 정리를 볼 수 없어요.</div>`;
  const attempt = currentAttempt(c.id);
  const draftCheck = ME ? loadDraft(ME.id, c, attempt) : { status: 'none' };
  const makeInitial = (base) => c.questions.map((q, i) => (base && base[i] != null ? structuredClone(base[i]) : blankAnswerFor(q)));

  let ans = makeInitial(draftCheck.status === 'ok' ? draftCheck.draft.answers : prev);
  const qa = $('#qarea');

  const draftMsgHTML = (state) => {
    if (state.type === 'error') {
      return `<div class="draft-bar err" role="status" aria-live="polite"><span>${ico('warn', 15)} 이 기기에서는 임시저장이 되지 않아요(저장 공간 부족 또는 차단됨). 페이지를 나가지 말고 바로 제출해 주세요.</span></div>`;
    }
    if (state.type === 'restored') {
      return `<div class="draft-bar" role="status" aria-live="polite"><span>${ico('save', 15)} 이전에 임시저장한 답안을 불러왔어요 (${fmtTime(state.savedAt)}). <b>임시저장은 제출이 아니에요!</b></span><div class="draft-actions"><button type="button" class="btn sm ghost" id="clearDraft">초안 지우기</button></div></div>`;
    }
    if (state.type === 'version-mismatch') {
      return `<div class="draft-bar" role="status" aria-live="polite"><span>${ico('info', 15)} 시험 문항이 바뀌어 이전 임시저장 답안을 불러오지 않았어요.</span></div>`;
    }
    if (state.type === 'saved') {
      return `<div class="draft-bar" role="status" aria-live="polite"><span>${ico('save', 15)} 임시저장됨 (${fmtTime(state.savedAt)}) · 아직 제출하지 않았어요. 다 풀고 아래 <b>제출하기</b>를 꼭 눌러요.</span></div>`;
    }
    return `<div class="draft-bar" role="status" aria-live="polite"><span>${ico('save', 15)} 입력한 답은 이 기기에 자동으로 임시저장돼요. <b>임시저장은 제출이 아니에요!</b></span></div>`;
  };

  qa.innerHTML = `<h2 style="margin-top:28px">${ico('pen', 22)} ${c.kind === 'concept' ? '확인 문제' : esc(c.title)}</h2>
    <div id="draftBar"></div>` +
    c.questions.map((q, i) => `<div class="q" id="q${i}"><div class="qh"><div class="qn">${i + 1}</div><div class="qt">${optLabel(q.q)}</div><span class="qstate" id="qs${i}"></span></div>${mediaHTML(q)}<div class="ans"></div></div>`).join('') +
    `<div class="sticky-foot"><button type="button" class="btn pri" id="sub">제출하기</button></div>`;

  const paintDraftBar = (state) => {
    const bar = $('#draftBar');
    if (!bar) return;
    bar.innerHTML = draftMsgHTML(state);
    const clr = $('#clearDraft');
    if (clr) {
      clr.onclick = () => {
        if (ME) clearDraft(ME.id, c.id, attempt);
        ans = makeInitial(prev);
        c.questions.forEach((q, i) => renderInput(q, i, ans, qa.querySelector(`#q${i} .ans`), onAnswerChange));
        clearIncompleteMarks();
        paintDraftBar({ type: 'idle' });
        toast('임시저장 답안을 지웠어요');
      };
    }
  };

  const clearIncompleteMarks = () => {
    c.questions.forEach((_, i) => {
      const qEl = $(`#q${i}`); if (qEl) qEl.classList.remove('incomplete');
      const stEl = $(`#qs${i}`); if (stEl) { stEl.textContent = ''; stEl.className = 'qstate'; }
    });
  };

  const updateQuestionMark = (i) => {
    const qEl = $(`#q${i}`), stEl = $(`#qs${i}`);
    if (!qEl || !stEl || !qEl.classList.contains('incomplete')) return;
    const st = questionCompleteness(c.questions[i], ans[i]);
    if (st === 'complete') {
      qEl.classList.remove('incomplete');
      stEl.textContent = '';
      stEl.className = 'qstate';
    } else if (st === 'partial') {
      stEl.textContent = '일부만 썼어요';
      stEl.className = 'qstate part';
    }
  };

  const onAnswerChange = (idx) => {
    if (seq !== VIEW_SEQ) return;
    updateQuestionMark(idx);
    if (!ME) return;
    const res = saveDraft(ME.id, c, attempt, ans);
    setDraftSaveFailed(!res.ok);
    paintDraftBar(res.ok ? { type: 'saved', savedAt: res.savedAt } : { type: 'error' });
  };

  if (draftCheck.status === 'ok') paintDraftBar({ type: 'restored', savedAt: draftCheck.draft.savedAt });
  else if (draftCheck.status === 'version-mismatch') paintDraftBar({ type: 'version-mismatch' });
  else paintDraftBar({ type: 'idle' });

  qa.querySelectorAll('[data-say]').forEach((b) => (b.onclick = () => speak(b.dataset.say)));
  c.questions.forEach((q, i) => renderInput(q, i, ans, qa.querySelector(`#q${i} .ans`), onAnswerChange));
  const firstQ = $('#q0');
  if (firstQ && firstQ.scrollIntoView) firstQ.scrollIntoView({ behavior: 'smooth' });

  const focusQuestion = (idx) => {
    const qEl = $(`#q${idx}`);
    if (!qEl) return;
    qEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const target = qEl.querySelector('input:not([disabled]), select:not([disabled]), button.opt:not([disabled]), button.chip:not([disabled])');
    if (target) setTimeout(() => target.focus(), 120);
  };

  const doSubmit = async () => {
    const subBtn = $('#sub');
    if (subBtn) subBtn.disabled = true;
    try {
      await S('/api/submit', { concept: c.id, answers: ans });
      setDraftSaveFailed(false);
      if (ME) clearDraft(ME.id, c.id, attempt);
      SUBS[c.id] = { concept: c.id, status: 'submitted', submitted_at: new Date().toISOString(), attempt };
      toast('제출했어요!');
      try { await loadMe(); } catch { toast('제출은 완료됐어요! 목록을 새로고침해 주세요.'); }
      if (seq === VIEW_SEQ) concept(c.id);
    } catch (e) {
      alert(e.message);
      if (subBtn) subBtn.disabled = false;
    }
  };

  $('#sub').onclick = () => {
    const report = inspectAnswers(c.questions, ans);
    clearIncompleteMarks();
    report.empty.forEach((i) => {
      const qEl = $(`#q${i}`), stEl = $(`#qs${i}`);
      if (qEl) qEl.classList.add('incomplete');
      if (stEl) { stEl.textContent = '아직 안 풀었어요'; stEl.className = 'qstate empty'; }
    });
    report.partial.forEach((i) => {
      const qEl = $(`#q${i}`), stEl = $(`#qs${i}`);
      if (qEl) qEl.classList.add('incomplete');
      if (stEl) { stEl.textContent = '일부만 썼어요'; stEl.className = 'qstate part'; }
    });

    const hasIssues = report.empty.length > 0 || report.partial.length > 0;
    const issueChips = [
      ...report.empty.map((i) => `<button type="button" class="review-chip empty" data-jump="${i}">${i + 1}번 (미응답)</button>`),
      ...report.partial.map((i) => `<button type="button" class="review-chip part" data-jump="${i}">${i + 1}번 (부분응답)</button>`),
    ].join('');

    openAccessibleModal({
      id: 'submitModal',
      label: '제출 전 확인',
      initialFocusSelector: hasIssues ? '#rvFix' : '#rvSend',
      html: `<div class="box" style="max-width:520px">
        <h2 style="margin-top:0">${ico('send', 20)} 제출 전 확인</h2>
        <p style="margin:6px 0">전체 <b>${report.total}문제</b> 중 <b>${report.completeCount}문제</b>를 모두 채웠어요.</p>
        ${hasIssues ? `<div class="notice" style="margin:10px 0">
          ${report.empty.length ? `<div>• 아직 안 푼 문제: <b>${report.empty.length}개</b></div>` : ''}
          ${report.partial.length ? `<div>• 일부만 쓴 문제: <b>${report.partial.length}개</b></div>` : ''}
          <div class="small muted" style="margin-top:4px">아래 번호를 누르면 그 문제로 바로 이동해요.</div>
        </div>
        <div class="review-list">${issueChips}</div>` : '<p class="muted small">모든 문제를 다 풀었어요!</p>'}
        ${c.locked ? `<div class="notice" style="margin:10px 0">${ico('warn', 15)} <b>이 시험은 한 번만 낼 수 있어요.</b> 제출하면 바꿀 수 없어요.</div>` : ''}
        <div class="bar" style="justify-content:flex-end;margin-bottom:0">
          <button type="button" class="btn" id="rvFix">${hasIssues ? '돌아가서 고치기' : '취소'}</button>
          <button type="button" class="btn pri" id="rvSend">이대로 제출하기</button>
        </div>
      </div>`,
      onMount: (m, close) => {
        m.querySelectorAll('[data-jump]').forEach((b) => {
          b.onclick = () => { const idx = +b.dataset.jump; close(false); focusQuestion(idx); };
        });
        m.querySelector('#rvFix').onclick = () => {
          close(false);
          const firstBad = report.partial[0] ?? report.empty[0];
          if (firstBad != null) focusQuestion(firstBad);
        };
        m.querySelector('#rvSend').onclick = () => { close(false); return doSubmit(); };
      },
    });
  };
}

function renderInput(q, i, ans, el, onChange) {
  const notify = () => { if (onChange) onChange(i); };
  if (q.t === 'text' || q.t === 'time') {
    el.innerHTML = `<input type="text" aria-label="${i + 1}번 문제 답" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.t === 'time' ? '예: 5:30' : '답을 쓰세요'}" value="${esc(ans[i])}">`;
    el.querySelector('input').oninput = (e) => { ans[i] = e.target.value; notify(); };
  } else if (q.t === 'choice' || q.t === 'pick') {
    el.innerHTML = `<div class="opts" role="group" aria-label="${i + 1}번 문제 보기">${q.opts.map((o, k) => `<button type="button" class="opt${q.optImg ? ' pic' : ''}" data-o="${esc(o)}" aria-pressed="false">${optLabel(o)}${q.optImg ? `<img src="${mediaUrl(q.optImg[k])}" alt="">` : ''}</button>`).join('')}</div>`;
    const paint = () => el.querySelectorAll('.opt').forEach((b) => {
      const on = q.t === 'pick' ? ans[i].includes(b.dataset.o) : ans[i] === b.dataset.o;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    el.querySelectorAll('.opt').forEach((b) => (b.onclick = () => {
      const o = b.dataset.o;
      if (q.t === 'pick') ans[i] = ans[i].includes(o) ? ans[i].filter((x) => x !== o) : [...ans[i], o];
      else ans[i] = o;
      paint();
      notify();
    }));
    paint();
  } else if (q.t === 'spellmean') {
    el.innerHTML = `<div class="sm2"><label>영어 철자<input type="text" aria-label="${i + 1}번 문제 영어 철자" data-k="0" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(ans[i][0])}"></label>
      <label>우리말 뜻<input type="text" aria-label="${i + 1}번 문제 우리말 뜻" data-k="1" autocomplete="off" value="${esc(ans[i][1])}"></label></div>`;
    el.querySelectorAll('[data-k]').forEach((x) => (x.oninput = () => { ans[i][+x.dataset.k] = x.value; notify(); }));
  } else if (q.t === 'spell') {
    let k = 0;
    el.innerHTML = `<div class="spell">${q.pat.split(' ').map((t) => (t === '__' ? `<input class="sp" maxlength="1" aria-label="${i + 1}번 문제 ${k + 1}번째 글자" data-k="${k}" value="${esc(ans[i][k++])}" autocomplete="off" autocapitalize="off" spellcheck="false">` : t === '/' ? '<span class="gap"></span>' : `<span class="ch">${esc(t)}</span>`)).join('')}<span class="mean">(${esc(q.mean)})</span></div>`;
    const boxes = [...el.querySelectorAll('input.sp')];
    boxes.forEach((x, j) => (x.oninput = () => { x.value = x.value.replace(/[^a-zA-Z]/g, '').slice(-1); ans[i][j] = x.value; notify(); if (x.value && boxes[j + 1]) boxes[j + 1].focus(); }));
  } else if (q.t === 'multi') {
    el.innerHTML = Array.from({ length: q.blanks }, (_, k) => q.sel
      ? `<label>${k + 1}) <select aria-label="${i + 1}번 문제 ${k + 1}번 선택" data-k="${k}"><option value="">고르세요</option>${q.sel[k].map((o) => `<option ${ans[i][k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`
      : `<input type="text" class="blank" aria-label="${i + 1}번 문제 ${k + 1}번 빈칸" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="빈칸 ${k + 1}" value="${esc(ans[i][k])}">`).join(' ');
    el.querySelectorAll('[data-k]').forEach((x) => (x.oninput = x.onchange = () => { ans[i][+x.dataset.k] = x.value; notify(); }));
  } else if (q.t === 'order') {
    // 같은 낱말이 여러 번 있는 경우까지 고려해 사용한 카드 표시
    const countUsed = (k) => { const w = q.words[k]; const before = q.words.slice(0, k).filter((x) => x === w).length; return ans[i].filter((x) => x === w).length > before; };
    const draw = (restoreTarget) => {
      el.innerHTML = `<div class="chips" aria-label="고른 카드">${ans[i].length ? ans[i].map((w, k) => `<button type="button" class="chip" data-r="${k}" aria-label="${esc(w)} 빼기">${esc(w)}</button>`).join('') + `<b style="font-size:22px;align-self:center">${q.end ?? '.'}</b>` : '<span class="muted small">아래 카드를 순서대로 누르세요</span>'}</div>
      <div class="opts" aria-label="카드 목록">${q.words.map((w, k) => { const used = countUsed(k); return `<button type="button" class="chip ${used ? 'used' : ''}" data-w="${k}" ${used ? 'disabled aria-disabled="true"' : ''} aria-label="${esc(w)} 넣기">${esc(w)}</button>`; }).join('')}</div>`;
      el.querySelectorAll('[data-w]').forEach((b) => (b.onclick = () => {
        const idx = +b.dataset.w;
        ans[i] = [...ans[i], q.words[idx]];
        notify();
        draw(() => {
          const next = el.querySelector('[data-w]:not([disabled])') || el.querySelector(`[data-r="${ans[i].length - 1}"]`);
          if (next) next.focus();
        });
      }));
      el.querySelectorAll('[data-r]').forEach((b) => (b.onclick = () => {
        const rIdx = +b.dataset.r;
        ans[i] = ans[i].filter((_, k) => k !== rIdx);
        notify();
        draw(() => {
          const next = el.querySelector(`[data-r="${Math.min(rIdx, ans[i].length - 1)}"]`) || el.querySelector('[data-w]:not([disabled])');
          if (next) next.focus();
        });
      }));
      if (restoreTarget) restoreTarget();
    };
    draw();
  }
}

// ---------- 결과 보기·출력 ----------
function showResult(c, sub, qa) {
  const fb = teacherNoteHTML(sub.feedback);
  const wrong = (sub.marks || []).map((m, i) => (m || c.questions[i].pending ? -1 : i)).filter((i) => i >= 0);
  const perfect = sub.score === c.questions.length;
  qa.innerHTML = `<div class="bar noprint" style="margin-top:24px"><h2 style="margin:0;flex:1;display:flex;align-items:center">${perfect ? '<img class="illus illus-badge" src="/img/badge-celebrate.jpg" alt="">' : `${ico('check', 22)}&nbsp;`}채점 결과: ${sub.score} / ${c.questions.length}</h2>${wrong.length ? `<button type="button" class="btn" id="retry">${ico('retry', 15)} 틀린 문제 다시 풀기 (${wrong.length}문제)</button> ` : ''}<button type="button" class="btn pri" id="prt">${ico('print', 15)} 결과 출력하기</button></div>
    <div class="result">${resultHeadHTML(c, sub, ME)}${fb}${resultItemsHTML(c, sub, sub.correct)}</div>`;
  if (fb) setTimeout(() => { const n = qa.querySelector('.tnote'); if (n) n.classList.add('pop'); }, 50);
  qa.querySelectorAll('[data-say]').forEach((b) => (b.onclick = () => speak(b.dataset.say)));
  $('#prt').onclick = () => printOnly(qa.querySelector('.result'));
  if (wrong.length) $('#retry').onclick = () => retryQuiz(c, sub, wrong, qa);
}

// 틀린 문제만 다시 풀기 — 연습이라 점수는 바뀌지 않음. 맞힐 때까지 남은 문제만 계속
function retryQuiz(c, sub, left, qa, round = 1) {
  const seq = VIEW_SEQ;
  const ans = c.questions.map(blankAnswerFor);
  $('#sum').innerHTML = `<div class="notice">${ico('lock', 15)} 다시 푸는 동안에는 정리를 볼 수 없어요.</div>`;
  qa.innerHTML = `<div class="bar" style="margin-top:24px"><h2 style="margin:0;flex:1">${ico('retry', 20)} 틀린 문제 다시 풀기${round > 1 ? ` · ${round}번째` : ''} <span class="muted small">(${left.length}문제)</span></h2><button type="button" class="btn sm" id="rtBack">← 결과로</button></div>
    <div class="notice small">연습이에요. 다시 풀어도 <b>점수는 바뀌지 않아요.</b> 모두 맞힐 때까지 도전해 보세요!</div>` +
    left.map((i) => { const q = c.questions[i]; return `<div class="q" id="q${i}"><div class="qh"><div class="qn">${i + 1}</div><div class="qt">${optLabel(q.q)}</div><div class="mark"></div></div>${mediaHTML(q)}<div class="ans"></div></div>`; }).join('') +
    `<div class="sticky-foot"><button type="button" class="btn pri" id="rtGo">${ico('check', 16)} 확인하기</button></div>`;
  qa.querySelectorAll('[data-say]').forEach((b) => (b.onclick = () => speak(b.dataset.say)));
  left.forEach((i) => renderInput(c.questions[i], i, ans, qa.querySelector(`#q${i} .ans`)));
  $('#rtBack').onclick = () => concept(c.id);
  const firstRetryQ = qa.querySelector('.q');
  if (firstRetryQ && firstRetryQ.scrollIntoView) firstRetryQ.scrollIntoView({ behavior: 'smooth' });
  $('#rtGo').onclick = async () => {
    $('#rtGo').disabled = true;
    let marks;
    try { marks = (await S('/api/retry', { concept: c.id, answers: Object.fromEntries(left.map((i) => [i, ans[i]])) })).marks; }
    catch (e) { if (seq === VIEW_SEQ) { alert(e.message); $('#rtGo').disabled = false; } return; }
    if (seq !== VIEW_SEQ) return;
    const still = left.filter((i) => !marks[i]);
    left.forEach((i) => { const m = qa.querySelector(`#q${i} .mark`); m.innerHTML = marks[i] ? ico('check', 26) : ico('x', 26); m.className = 'mark ' + (marks[i] ? 'ok' : 'no'); });
    const foot = qa.querySelector('.sticky-foot');
    if (!still.length) {
      foot.innerHTML = `<div class="notice ok" style="margin:0;display:inline-flex;align-items:center;gap:8px"><img class="illus illus-badge" src="/img/badge-celebrate.jpg" alt=""><span>모두 맞혔어요! 정말 잘했어요.</span></div> <button type="button" class="btn" id="rtEnd">← 결과로</button>`;
      toast('모두 맞혔어요!');
    } else {
      foot.innerHTML = `<span class="small" style="align-self:center">${left.length - still.length}문제 맞힘 · <b>${still.length}문제</b> 남음</span> <button type="button" class="btn pri" id="rtNext">${ico('retry', 15)} 남은 문제 다시 풀기</button> <button type="button" class="btn" id="rtEnd">← 결과로</button>`;
      $('#rtNext').onclick = () => retryQuiz(c, sub, still, qa, round + 1);
    }
    $('#rtEnd').onclick = () => concept(c.id);
  };
}

// 채점이 끝난 시험을 모아 보기·출력 (배치 엔드포인트 우선, 없으면 병렬 fallback)
async function allResults() {
  const seq = ++VIEW_SEQ;
  scrollTo(0, 0);
  const done = CONCEPTS.filter((c) => SUBS[c.id] && SUBS[c.id].status === 'graded');
  app.innerHTML = `<button type="button" class="btn sm noprint" id="back">← 목록</button>
    <div class="bar noprint"><h2 style="margin:0;flex:1">${ico('note', 22)} 내 결과 모아 보기</h2>${done.length ? `<button type="button" class="btn pri" id="prt">${ico('print', 15)} 모두 출력하기</button>` : ''}</div>
    <div id="all" class="result">${done.length ? '<p class="muted">불러오는 중…</p>' : '<div class="notice">아직 선생님이 채점을 마친 시험이 없어요.</div>'}</div>`;
  $('#back').onclick = home;
  if (!done.length) return;

  let parts = [];
  let batchOk = false;
  try {
    const batch = await S('/api/submissions');
    if (seq !== VIEW_SEQ) return;
    if (Array.isArray(batch.items)) {
      parts = batch.items
        .filter((item) => item && item.concept && item.submission && item.submission.status === 'graded')
        .map((item) => ({ c: item.concept, sub: item.submission }));
      batchOk = true;
    } else if (Array.isArray(batch.submissions)) {
      parts = (await Promise.all(batch.submissions.map(async (item) => {
        const cid = item.concept ?? item.concept_id ?? item.id;
        const cBase = CONCEPTS.find((x) => x.id === cid);
        if (!cBase) return null;
        const sub = item.submission || item;
        if (sub.status !== 'graded') return null;
        const c = item.questions ? { ...cBase, questions: item.questions } : await loadConceptDetail(cid);
        return { c, sub };
      }))).filter(Boolean);
      batchOk = true;
    }
  } catch {}

  if (!batchOk) {
    parts = (await Promise.all(done.map(async (cBase) => {
      try {
        const [subRes, c] = await Promise.all([S(`/api/submission?concept=${cBase.id}`), loadConceptDetail(cBase.id)]);
        return { c, sub: subRes.submission };
      } catch { return null; }
    }))).filter(Boolean);
  }
  if (seq !== VIEW_SEQ) return;

  if (!parts.length) {
    $('#all').innerHTML = '<div class="notice">결과를 불러오지 못했어요. 다시 시도해 주세요.</div>';
    return;
  }
  $('#all').innerHTML = studentReportHTML(ME, parts.map((p) => ({ ...p, correct: p.sub.correct })), true, `${ME.grade}학년 2학기 영어`);
  $('#prt').onclick = () => printOnly($('#all'));
}

start();
</script>
